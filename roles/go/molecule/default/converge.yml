---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  vars:
    # Minimal provisioner-context stand-ins so the role runs standalone.
    settings:
      hostname: startcloud-go-debian12
      domain: startcloud.test
    # Role variables (defaults/main.yml + meta/argument_specs.yml).
    # Version, URL and checksum are the shipped defaults so the scenario
    # exercises the checksum the role actually ships with.
    run_tasks: true
    go_version: "1.17.3"
    go_platform: linux
    go_arch: amd64
    go_tarball: "go{{ go_version }}.{{ go_platform }}-{{ go_arch }}.tar.gz"
    go_download_url: "https://dl.google.com/go/{{ go_tarball }}"
    go_checksum: "550f9845451c0c94be679faf116291e7807a8d78b43149f9506c1b15eb89008c"
  pre_tasks:
    - name: Ensure the tarball download directory the role writes to exists
      ansible.builtin.file:
        path: /usr/local/src
        state: directory
        mode: "0755"
  roles:
    - role: go
