---
- name: "Block to Allow Loading of Variables without running task"
  when: run_tasks
  block:
    - name: "Setting up Debian Installations"
      when: "ansible_os_family == 'Debian'"
      block:
        - name: "Gathering DEB architecture"
          ansible.builtin.command: dpkg --print-architecture
          register: deb_architecture
          changed_when: false

        - name: "Printing DEB architecture"
          ansible.builtin.debug:
            msg: "deb_architecture.stdout: {{ deb_architecture.stdout }}"

        - name: "Ensuring apt cache is updated"
          ansible.builtin.apt:
            cache_valid_time: 3600
            update_cache: true

        - name: "Upgrading all apt packages"
          ansible.builtin.apt:
            upgrade: dist
            update_cache: true

        - name: "Adding Additional Dependencies {{ squid_packages }}"
          ansible.builtin.apt:
            name: "{{ squid_packages }}"
            state: present

    ## The template writes the whole file, so the delete of /etc/squid/squid.conf
    ## that used to sit here bought nothing - it only guaranteed a changed report
    ## on every run, since the write overwrites whatever the package shipped.
    - name: "Creating New Squid Configuration"
      ansible.builtin.template:
        dest: /etc/squid/squid.conf
        src: squid.conf.j2
        mode: "0644"
      notify: "Restart squid"

    - name: "Running Squid Configuration Parse Check"
      ansible.builtin.command: squid -k parse
      register: squid_parse_result
      changed_when: false
      failed_when: false

    - name: "Failing if Squid Configuration is Invalid"
      ansible.builtin.fail:
        msg: "Squid configuration is invalid: {{ squid_parse_result.stderr | default('') }}"
      when: squid_parse_result.rc != 0

    - name: "Checking if Squid Config is Valid"
      ansible.builtin.debug:
        msg: "Squid configuration is valid."
      when: squid_parse_result.rc == 0

    ## squid only needs bouncing when its configuration actually changes, and
    ## that restart hangs off the template above. An unconditional
    ## `state: restarted` here reported changed on every run and never converged.
    - name: "Starting and Enabling Squid Service"
      ansible.builtin.systemd_service:
        name: squid
        state: started
        enabled: true
