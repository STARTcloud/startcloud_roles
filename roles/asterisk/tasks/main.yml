---
- name: "Block to Allow Loading of Variables without running task"
  when: run_tasks
  block:
    - name: "Setting up Debian Installations"
      when: "ansible_os_family == 'Debian'"
      block:
        - name: "Including additional vars"
          ansible.builtin.include_vars:
            file: "vars/debian{{ '13' if ansible_distribution_major_version | int >= 13 else '12' }}.yml"

        - name: "Gathering DEB architecture"
          ansible.builtin.command: dpkg --print-architecture
          register: deb_architecture
          changed_when: false

        - name: "Printing DEB architecture"
          ansible.builtin.debug:
            msg: "deb_architecture.stdout: {{ deb_architecture.stdout }}"

        - name: "Ensuring apt cache is updated"
          ansible.builtin.apt:
            cache_valid_time: 3600
            update_cache: true

        - name: "Adding Additional Dependencies"
          ansible.builtin.apt:
            name: "{{ asterisk_packages }}"
            state: present

- name: "Asterisk User and Directory Setup"
  when: run_tasks and (ansible_os_family == 'Debian')
  block:
    - name: "Checking if Asterisk is installed (Pre-Setup)"
      ansible.builtin.stat:
        path: "{{ asterisk_config_dir }}"
      register: asterisk_bin_path

    - name: "Ensuring group asterisk exists"
      ansible.builtin.group:
        name: "{{ asterisk_group }}"
        state: present

    ## password_hash('sha512') salts randomly, so the hash differs on every
    ## run and the module reports changed forever. The password only has to be
    ## seeded when the account is created, so compare nothing on later runs.
    - name: "Adding the user asterisk"
      ansible.builtin.user:
        comment: Asterisk SIP User
        shell: /bin/bash
        name: "{{ asterisk_user }}"
        password: "{{ asterisk_user_pass | password_hash('sha512') }}"
        update_password: on_create
        groups:
          - "{{ asterisk_group }}"
          - audio
          - dialout
          - "{{ service_group }}"
        append: true

    - name: "Creating Export Directory"
      ansible.builtin.file:
        path: /data
        state: directory
        mode: "0755"
        owner: "{{ asterisk_user }}"
        group: "{{ asterisk_group }}"

    - name: "Creating asterisk directories if they do not exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ asterisk_user }}"
        mode: "0755"
      with_items:
        - "{{ asterisk_source_dir }}"
        - "{{ asterisk_config_dir }}"

    ## Only fetched when Asterisk still needs to be built — the source tree is
    ## about a gigabyte and the compile block below is skipped once installed.
    - name: "Downloading and Extracting Asterisk"
      ansible.builtin.unarchive:
        src: "{{ asterisk_package }}"
        dest: "{{ asterisk_source_dir }}"
        remote_src: true
        list_files: true
      register: asterisk_archive_contents
      when: not asterisk_bin_path.stat.exists

    - name: "Checking if Asterisk is installed (Post-Download)"
      ansible.builtin.debug:
        msg: "Asterisk directory path is {{ asterisk_source_dir }}/{{ asterisk_archive_contents.files[0] }}, installed: {{ asterisk_bin_path.stat.exists }}"
      when: not asterisk_bin_path.stat.exists

- name: "Asterisk Compilation and Installation"
  when: run_tasks and (ansible_os_family == 'Debian') and not asterisk_bin_path.stat.exists
  block:
    ## BUILD_NATIVE must stay disabled: Asterisk's default -march=native tunes
    ## the binary to the build host's CPU, so an image baked on a newer CPU
    ## emits instructions (AVX-512) that crash with SIGILL on older tenant
    ## hardware. Building generic x86-64 keeps the binary portable across
    ## machines.
    - name: "Installing Asterisk Packages"
      ansible.builtin.command: "{{ item }}"
      with_items:
        - ./configure --with-jansson-bundled
        - make -j{{ ansible_processor_vcpus }} menuselect.makeopts
        - menuselect/menuselect --enable app_voicemail_odbc --disable BUILD_NATIVE menuselect.makeopts
        - make -j{{ ansible_processor_vcpus }}
        - make install
        - make config
        - make install-logrotate
        - ldconfig
      args:
        chdir: "{{ asterisk_source_dir }}/{{ asterisk_archive_contents.files[0] }}"
      async: 3600
      poll: 15
      changed_when: true

- name: "Asterisk Final Configuration"
  when: run_tasks and (ansible_os_family == 'Debian')
  block:
    ## Only the directories themselves carry a mode. Recursing 0755 into these
    ## trees is what made the role non-convergent: the daemon recreates its
    ## control socket, pid file, astdb and log files on every start with their
    ## own modes, and the config copy further down deliberately lands 0644
    ## files in /etc/asterisk - a recursive chmod flips all of that back on
    ## every run, and the copy flips it again on the next one.
    - name: "Creating Asterisk runtime directories"
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ asterisk_user }}"
        group: "{{ asterisk_group }}"
        mode: "0755"
        state: directory
      loop:
        - "{{ asterisk_lib_dir }}"
        - "{{ asterisk_log_dir }}"
        - "{{ asterisk_run_dir }}"
        - "{{ asterisk_spool_dir }}"
        - "{{ asterisk_lib64_dir }}"
        - "{{ asterisk_user_lib_dir }}"
        - "{{ asterisk_config_dir }}"

    ## Ownership only, and only on the pass that actually builds Asterisk:
    ## `make install` lays these trees down as root, so they have to be handed
    ## to the asterisk account once. Everything the daemon writes afterwards it
    ## writes as asterisk, so there is nothing left for a rerun to repair.
    - name: "Changing file ownership, group and permissions"
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ asterisk_user }}"
        group: "{{ asterisk_group }}"
        state: directory
        recurse: true
      loop:
        - "{{ asterisk_lib_dir }}"
        - "{{ asterisk_log_dir }}"
        - "{{ asterisk_run_dir }}"
        - "{{ asterisk_spool_dir }}"
        - "{{ asterisk_lib64_dir }}"
        - "{{ asterisk_user_lib_dir }}"
        - "{{ asterisk_config_dir }}"
      when: not asterisk_bin_path.stat.exists

    - name: "Setting Asterisk ACLs"
      ansible.builtin.file:
        path: "{{ asterisk_log_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ asterisk_user }}"
        group: "{{ asterisk_group }}"

    - name: "Removing Asterisk init.d script"
      ansible.builtin.file:
        path: /etc/init.d/asterisk
        state: absent

    ## Every task that writes a file Asterisk reads at startup notifies the
    ## "Restarting asterisk" handler, and the daemon is only started once the
    ## whole config set is on disk. Starting it before the config deploy left
    ## the daemon running against whatever `make config` shipped.
    - name: "Copying Asterisk Templates"
      ansible.builtin.template:
        src: asterisk.service.j2
        dest: /etc/systemd/system/asterisk.service
        mode: "0644"
      notify: "Restarting asterisk"

    - name: "Copying Asterisk configuration to remote"
      ansible.builtin.copy:
        src: "./files/conf/"
        dest: "{{ asterisk_config_dir }}"
        owner: "{{ asterisk_user }}"
        group: "{{ asterisk_group }}"
        mode: "0644"
      notify: "Restarting asterisk"

    - name: "Copying Config files to Asterisk Box"
      ansible.builtin.template:
        src: "sysconfig.sh.j2"
        dest: "/etc/default/asterisk"
        mode: "+x"
        owner: "{{ asterisk_user }}"
        group: "{{ asterisk_group }}"
      notify: "Restarting asterisk"

    - name: "Loading Asterisk Security module"
      ansible.builtin.lineinfile:
        path: "{{ asterisk_config_dir }}/modules.conf"
        search_string: "load => res_security_log.so"
        line: load => res_security_log.so
      notify: "Restarting asterisk"

    - name: "Enabling Asterisk Security logs"
      ansible.builtin.lineinfile:
        path: "{{ asterisk_config_dir }}/logger.conf"
        search_string: "security = security"
        line: security = security
      notify: "Restarting asterisk"

    - name: "Starting and Enabling Asterisk server"
      ansible.builtin.systemd_service:
        name: asterisk.service
        state: started
        enabled: true
        daemon_reload: true

    ## fail2ban only has to be bounced when this jail actually changes, so the
    ## restart hangs off the template. An unconditional `state: restarted` here
    ## reported changed on every single run and could never converge.
    - name: "Copying jail.local template"
      ansible.builtin.template:
        src: asterisk.jail.local.j2
        dest: /etc/fail2ban/jail.d/asterisk.conf
        mode: "0644"
      notify: "Restarting fail2ban"

    - name: "Starting and Enabling fail2ban"
      ansible.builtin.systemd_service:
        name: fail2ban
        state: started
        enabled: true
