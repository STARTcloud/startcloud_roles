---
argument_specs:
  main:
    short_description: Grafana installation and configuration
    description:
      - Installs Grafana from the official Grafana OSS APT repository, renders /etc/grafana/grafana.ini and runs grafana-server under systemd.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      grafana_packages:
        type: list
        elements: str
        description: Prerequisite packages installed before the Grafana APT repository is added.
      grafana_package:
        type: str
        default: grafana
        description: Package name installed from the Grafana repository once it is configured.
      grafana_protocol:
        type: str
        default: http
        description: Protocol Grafana serves with — http, https, h2 or socket.
      grafana_http_addr:
        type: str
        default: ""
        description: Address Grafana binds to; empty binds every interface.
      grafana_http_port:
        type: int
        default: 3000
        description: Port Grafana listens on.
      grafana_domain:
        type: str
        description: Domain Grafana builds its root URL from; defaults to the host FQDN from settings.
      grafana_cert_file:
        type: str
        description: Certificate served when grafana_protocol is https or h2; defaults to the per-host certificate the ssl role writes under cert_dir.
      grafana_cert_key:
        type: str
        description: Private key served when grafana_protocol is https or h2; defaults to the per-host key the ssl role writes under cert_dir.
