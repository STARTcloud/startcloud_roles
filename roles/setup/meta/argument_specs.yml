---
argument_specs:
  main:
    short_description: Initial per-host system setup
    description:
      - Performs baseline setup before other roles run — sets the timezone, creates support-bundle directories, writes the
        resolved Ansible variables to the support bundle, reports provisioner versions, and installs the root SSH key on
        platforms without a preseed/kickstart.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      show_help:
        type: bool
        default: true
        description: Whether to display help/informational output during setup.
      installer_dir:
        type: str
        default: /vagrant/installers
        description: Directory where installer artifacts are staged.
      completed_dir:
        type: str
        default: /vagrant/completed
        description: Directory used to mark completed provisioning steps.
      timezone:
        type: str
        default: America/Chicago
        description: System timezone to set on Linux/BSD guests.
      win_timezone:
        type: str
        default: Central Standard Time
        description: System timezone to set on Windows guests.
      debug_all:
        type: bool
        default: false
        description: Enable verbose debug output across the role.
      email:
        type: str
        default: support@startcloud.com
        description: Contact email recorded for the setup.
      root_ssh_key:
        type: str
        default: ""
        description: >-
          Optional SSH public key installed for root on platforms without a preseed/kickstart (empty = skip). On a running
          OPNsense firewall with opnsense_api_key set, the key goes into root's user record through the firewall's API,
          which keeps it across the firewall's own rewrites of authorized_keys.
      opnsense_api_port:
        type: int
        default: 443
        description: Port the OPNsense web GUI and API listen on.
      opnsense_api_url:
        type: str
        description: Base address of the OPNsense API; defaults to https://<inventory_hostname>:<opnsense_api_port>/api.
      opnsense_api_key:
        type: str
        default: ""
        description: OPNsense API key the lane signs in with; empty writes root's key file directly, the image-build way.
      opnsense_api_secret:
        type: str
        default: ""
        description: Secret of opnsense_api_key.
      opnsense_api_validate_certs:
        type: bool
        default: true
        description: Whether the firewall's web GUI certificate is checked on API calls.
      installer_base_url:
        type: str
        description: Base URL for downloading installers; resolved from secrets when set.
      installer_url_user:
        type: str
        description: Username for authenticating to the installer base URL; resolved from secrets.
      installer_url_pass:
        type: str
        description: Password for authenticating to the installer base URL; resolved from secrets.
      installer_org:
        type: str
        default: Prominic
        description: Organization segment of the installer download URL; resolved from secrets.
      installer_url_pattern:
        type: str
        default: "{base}/api/organization/{org}/download/{app}/release/{version}/patch/{variant}/file/{name}/download"
        description: Download URL layout with {base}, {org}, {app}, {version}, {variant} and {name} tokens; resolved from secrets.
