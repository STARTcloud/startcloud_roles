---
argument_specs:
  main:
    short_description: mumble-web HTML5 client container deployment
    description:
      - Deploys mumble-web, a browser-based Mumble client, as a Docker container. The default image bundles websockify
        and talks straight to a Mumble (murmur) server. mumble-web-proxy, which bridges browser WebSocket/WebRTC to
        murmur for WebRTC-mode client builds, is opt-in because upstream publishes no official container image.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      mumble_web_network:
        type: str
        default: mumble-web
        description: Docker network shared by the client and the optional proxy container.
      mumble_web_restart_policy:
        type: str
        default: unless-stopped
        description: Docker restart policy applied to the deployed containers.
      mumble_web_image:
        type: str
        default: "rankenstein/mumble-web:latest"
        description: mumble-web HTML5 client container image and tag.
      mumble_web_container_name:
        type: str
        default: mumble-web
        description: Name of the mumble-web client container.
      mumble_web_http_port:
        type: int
        default: 8080
        description: Host port mapped to the mumble-web web UI.
      mumble_web_container_http_port:
        type: int
        default: 8080
        description:
          - Port the client image serves HTTP on inside the container.
          - rankenstein/mumble-web binds 8080; the EXPOSE 80 in its image metadata is stale.
      mumble_web_server_host:
        type: str
        default: ""
        description:
          - Hostname or address of the upstream Mumble (murmur) server as reachable from inside the containers.
          - Has no default and must be set by the caller; the role fails when it is empty. A loopback address would
            resolve to the container's own loopback rather than to the murmur host.
      mumble_web_server_port:
        type: int
        default: 64738
        description: TCP port of the upstream Mumble (murmur) server.
      mumble_web_proxy_enabled:
        type: bool
        default: false
        description:
          - Deploy the mumble-web-proxy WebSocket/WebRTC bridge alongside the client.
          - Defaults to false because upstream publishes no official mumble-web-proxy image; enabling it requires
            supplying a self-built image in mumble_web_proxy_image and a WebRTC-mode mumble_web_image.
      mumble_web_proxy_image:
        type: str
        default: ""
        description:
          - mumble-web-proxy container image and tag.
          - Has no default because no official image is published upstream; required when mumble_web_proxy_enabled.
      mumble_web_proxy_container_name:
        type: str
        default: mumble-web-proxy
        description: Name of the mumble-web-proxy container.
      mumble_web_proxy_ws_port:
        type: int
        default: 64737
        description: WebSocket port the proxy listens on and publishes to the host.
      mumble_web_ice_port_min:
        type: int
        default: 20000
        description: Lower bound of the UDP port range published for WebRTC (ICE) voice.
      mumble_web_ice_port_max:
        type: int
        default: 20010
        description: Upper bound of the UDP port range published for WebRTC (ICE) voice.
