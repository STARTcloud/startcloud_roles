---
run_tasks: true

# Docker network shared by the web client and the optional WebSocket proxy so
# the client can reach the proxy by container name.
mumble_web_network: mumble-web

# Restart policy applied to the deployed containers.
mumble_web_restart_policy: unless-stopped

# mumble-web HTML5 client container. rankenstein/mumble-web bundles websockify,
# tunnelling the Mumble control and voice stream straight to murmur over
# WebSocket - no proxy container required.
mumble_web_image: "rankenstein/mumble-web:latest"
mumble_web_container_name: mumble-web
mumble_web_http_port: 8080
# Port the client image serves HTTP on inside the container. rankenstein/mumble-web
# listens on 8080 ("Listen on :8080" in its startup log); the EXPOSE 80 left in its
# image metadata is stale and does not reflect where the server actually binds.
mumble_web_container_http_port: 8080

# Upstream Mumble/murmur server, as reachable from inside the containers.
# Deliberately empty: 127.0.0.1 is the container's own loopback and is never the
# murmur host, so the address has to be supplied by the caller.
mumble_web_server_host: ""
mumble_web_server_port: 64738

# mumble-web-proxy bridges browser WebSocket/WebRTC to murmur for WebRTC-mode
# mumble-web builds. Upstream (github.com/johni0702/mumble-web-proxy) ships no
# official container image - it has to be built from source - so this deployment
# is opt-in and mumble_web_proxy_image has no default.
mumble_web_proxy_enabled: false
mumble_web_proxy_image: ""
mumble_web_proxy_container_name: mumble-web-proxy
mumble_web_proxy_ws_port: 64737

# UDP port range published for WebRTC (ICE) voice traffic (proxy only).
mumble_web_ice_port_min: 20000
mumble_web_ice_port_max: 20010
