---
argument_specs:
  main:
    short_description: Site-to-site IPsec tunnels with strongSwan swanctl and xfrm interfaces
    description:
      - Installs strongSwan (charon-systemd + swanctl), renders the connection and secrets configuration for a list of
        peers, and creates one routed xfrm interface per peer via ifupdown. Supports running strongswan inside a
        network namespace. Currently Debian-family only; other OS families fail fast with a clear message.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      ipsec_peers:
        type: list
        elements: dict
        default: []
        description: One entry per IPsec peer; peer N gets xfrm interface ipsecN with if_id ipsec_base_if_id + N.
        options:
          name:
            type: str
            required: true
            description: Short peer name used in the connection name (to-<name>) and interface comments.
          me:
            type: str
            required: true
            description: Local public address strongSwan binds the connection to.
          other:
            type: str
            required: true
            description: Remote peer public address.
          myid:
            type: str
            description: Local IKE identity; defaults to the value of me.
          otherid:
            type: str
            description: Remote IKE identity; defaults to the value of other.
          psk:
            type: str
            required: true
            description: Pre-shared key for this peer — supply from the gitignored root vault.yml, never inline.
          ipsec_net:
            type: str
            required: true
            description: Local tunnel address in CIDR point-to-point form (e.g. 10.10.0.1/30); the peer side is derived with ansible.utils.ipaddr('peer').
          ipsec_net6:
            type: str
            description: Optional IPv6 tunnel address added to the xfrm interface.
          routes:
            type: list
            elements: str
            description: Destination networks routed through this tunnel via the peer tunnel address.
      ipsec_namespace:
        type: str
        default: ""
        description: Network namespace to run strongswan and the xfrm interfaces in; empty string means the host namespace.
      ipsec_base_if_id:
        type: int
        default: 158
        description: if_id of the first peer's xfrm interface; subsequent peers increment from it. Must match on both tunnel ends.
      ipsec_proposals:
        type: str
        default: aes256-sha256-modp2048
        description: IKEv2 proposals for the connection.
      ipsec_esp_proposals:
        type: str
        default: aes256-sha256-modp2048
        description: ESP proposals for the child SA.
