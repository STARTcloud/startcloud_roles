---
- name: Converge
  hosts: all
  become: true
  vars:
    run_tasks: true
    ## startcloud_keepalived_state is deliberately not set: the role's own
    ## default has to render as the uppercase MASTER keepalived's parser wants.
    startcloud_keepalived_virtual_router_id: 60
    startcloud_keepalived_priority: 101
    ## Left empty on purpose: this exercises the runtime derivation of the
    ## virtual IP from the first adapter's subnet (host part .250).
    startcloud_keepalived_virtual_ipaddress: ""
    ## A real VRRP password (8 characters, keepalived's limit) — verify checks
    ## it lands verbatim in the authentication block.
    startcloud_keepalived_auth_pass: "V1pS3cr7"
  roles:
    - role: keepalived
