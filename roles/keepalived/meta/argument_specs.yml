---
argument_specs:
  main:
    short_description: Configure keepalived VRRP failover
    description:
      - Installs keepalived and renders a VRRP instance that advertises a virtual IP address and tracks the local HAProxy process for high-availability failover.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      startcloud_keepalived_state:
        type: str
        default: MASTER
        description: Initial VRRP state for this node; keepalived matches MASTER or BACKUP literally and treats anything else as BACKUP.
      startcloud_keepalived_virtual_router_id:
        type: int
        default: 60
        description: VRRP virtual router ID shared by all nodes in the same group.
      startcloud_keepalived_auth_pass:
        type: str
        default: STARTcld
        description: VRRP simple authentication password written into the authentication block; keepalived truncates it at 8 characters.
      startcloud_keepalived_virtual_ipaddress:
        type: str
        default: ""
        description: Virtual IP address advertised by the VRRP instance. Empty derives host .250 on the first adapter's subnet at runtime.
      startcloud_keepalived_priority:
        type: int
        default: 101
        description: VRRP priority for this node; the highest priority becomes master.
      startcloud_keepalived_nopreempt:
        type: bool
        default: false
        description: Render nopreempt so a recovered higher-priority node does not take the master role back; keepalived honors it only when state is BACKUP on all nodes.
      startcloud_keepalived_unicast_peers:
        type: list
        elements: str
        default: []
        description: Peer IP addresses for VRRP unicast mode; when non-empty the instance advertises via unicast_peer from the first adapter's address instead of multicast. Required on networks without multicast such as cloud VPCs.
      startcloud_keepalived_digitalocean_failover:
        type: bool
        default: false
        description: >-
          Replace the floated virtual IP with DigitalOcean reserved IP failover: no virtual_ipaddress block is rendered,
          and a notify_master script assigns the reserved IP to this droplet through the DigitalOcean API using
          secrets.DO_TOKEN and the droplet ID from the metadata service.
      startcloud_keepalived_digitalocean_reserved_ip:
        type: str
        default: ""
        description: The DigitalOcean reserved IP the notify_master script assigns to this droplet on promotion.
