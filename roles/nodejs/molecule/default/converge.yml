---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  vars:
    # Provisioner-context stand-in: defaults/main.yml resolves
    # nodejs_install_npm_user from service_user, so leave it unset here and let
    # the default chain do the work.
    service_user: startcloud
    # Role variables (defaults/main.yml + meta/argument_specs.yml).
    run_tasks: true
    nodejs_version: "22.x"
    npm_config_prefix: /usr/local/lib/npm
    npm_config_unsafe_perm: "true"
    nodejs_generate_etc_profile: true
    nodejs_npm_global_packages:
      # Tiny, dependency-free, no install scripts: exercises the npm loop
      # (mapping with pinned version) without dragging in a build toolchain.
      - name: left-pad
        version: 1.3.0
      # Shorthand string form, exercises the item.name | default(item) branch.
      - is-odd
    nodejs_package_json_path: ""
  roles:
    - role: nodejs
