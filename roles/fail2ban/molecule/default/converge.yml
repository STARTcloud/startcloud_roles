---
- name: Converge
  hosts: all
  become: true
  vars:
    run_tasks: true
    ## fail2ban_loglevel and fail2ban_dbpurgeage are deliberately set away from
    ## both the role defaults and the values fail2ban.conf ships, so verify can
    ## prove the running server took its settings from the rendered
    ## fail2ban.local rather than from the packaged configuration.
    fail2ban_loglevel: DEBUG
    fail2ban_logtarget: /var/log/fail2ban.log
    fail2ban_socket: /var/run/fail2ban/fail2ban.sock
    fail2ban_pidfile: /var/run/fail2ban/fail2ban.pid
    fail2ban_dbfile: /var/lib/fail2ban/fail2ban.sqlite3
    fail2ban_dbpurgeage: 2d
    ## Consumer-extension exercise: one supplied filter + jail (dummy action, so
    ## the container needs no iptables) and an extra ignoreip, so verify can
    ## prove the extension path renders and the server loads the jail.
    fail2ban_ignoreip: "192.0.2.0/24"
    fail2ban_filters:
      - name: molecule-probe
        content: |
          [Definition]
          failregex = ^molecule-probe-fail from <HOST>$
          ignoreregex =
    fail2ban_jails:
      - name: molecule-probe
        enabled: true
        logpath: /var/log/fail2ban.log
        maxretry: 3
        bantime: "1h"
        findtime: "10m"
        filter: molecule-probe
        action: "dummy"
    settings:
      hostname: startcloud-fail2ban-debian12
      domain: molecule.test
  pre_tasks:
    - name: Refresh the apt cache so the role's install task can resolve packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

  roles:
    - role: fail2ban
