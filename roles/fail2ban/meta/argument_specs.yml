---
argument_specs:
  main:
    short_description: Fail2ban installation and server configuration
    description:
      - Installs the Fail2ban package, creates its configuration and jail.d directories, renders the server settings into
        /etc/fail2ban/fail2ban.local and the jail overrides into /etc/fail2ban/jail.local, and starts and enables the service
        on Debian-family systems. Both files are .local overrides, so they are read after the packaged configuration and
        survive a package upgrade; changing either one restarts the service through a handler.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      fail2ban_loglevel:
        type: str
        default: INFO
        description: Log verbosity level for the Fail2ban server, rendered as loglevel in the [Definition] section of /etc/fail2ban/fail2ban.local.
      fail2ban_logtarget:
        type: str
        default: /var/log/fail2ban.log
        description: Path Fail2ban writes its log to, rendered as logtarget in the [Definition] section of /etc/fail2ban/fail2ban.local.
      fail2ban_socket:
        type: str
        default: /var/run/fail2ban/fail2ban.sock
        description: Unix socket path used by the Fail2ban server, rendered as socket in the [Definition] section of /etc/fail2ban/fail2ban.local.
      fail2ban_pidfile:
        type: str
        default: /var/run/fail2ban/fail2ban.pid
        description: PID file path for the Fail2ban server, rendered as pidfile in the [Definition] section of /etc/fail2ban/fail2ban.local.
      fail2ban_dbfile:
        type: str
        default: /var/lib/fail2ban/fail2ban.sqlite3
        description: SQLite database file used to persist ban state, rendered as dbfile in the [Definition] section of /etc/fail2ban/fail2ban.local.
      fail2ban_dbpurgeage:
        type: str
        default: 1d
        description: Age after which old bans are purged from the database, rendered as dbpurgeage in the [Definition] section of /etc/fail2ban/fail2ban.local.
      fail2ban_default_bantime:
        type: str
        default: ""
        description: Optional [DEFAULT] bantime rendered into jail.local; omitted when empty.
      fail2ban_default_findtime:
        type: str
        default: ""
        description: Optional [DEFAULT] findtime rendered into jail.local; omitted when empty.
      fail2ban_default_maxretry:
        type: str
        default: ""
        description: Optional [DEFAULT] maxretry rendered into jail.local; omitted when empty.
      fail2ban_default_banaction:
        type: str
        default: ""
        description: >-
          Optional [DEFAULT] banaction rendered into jail.local; omitted when empty, leaving the packaged default.
          nftables-allports cuts a banned source off from every port rather than only the one it probed.
      fail2ban_ignoreip:
        type: str
        default: ""
        description: Space-separated extra ignoreip entries appended after the loopback addresses in jail.local's [DEFAULT]; the line is omitted when empty.
      fail2ban_sshd_enabled:
        type: bool
        default: false
        description: Whether the packaged Debian [sshd] jail stays enabled; jail.local always carries the block so this value wins over jail.d/defaults-debian.conf.
      fail2ban_sshd_mode:
        type: str
        default: ""
        description: Optional filter mode of the [sshd] jail (normal, ddos, extra or aggressive); omitted when empty. aggressive also matches pre-auth probes and banner scans.
      fail2ban_filters:
        type: list
        elements: dict
        default: []
        description: >-
          Consumer-supplied filter definitions; each item's name and content are written to
          /etc/fail2ban/filter.d/<name>.conf, letting service-specific roles or playbooks (Asterisk,
          HAProxy, etc.) ship filters through this role without the role hardcoding any service.
      fail2ban_jails:
        type: list
        elements: dict
        default: []
        description: >-
          Consumer-supplied jail blocks appended to jail.local. Each item requires name and may set
          enabled, port, logpath, backend, filter, action, maxretry, bantime and findtime; omitted
          keys are not rendered.
