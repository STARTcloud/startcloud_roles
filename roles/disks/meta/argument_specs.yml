---
argument_specs:
  main:
    short_description: Root disk expansion and additional disk configuration
    description:
      - Expands the root partition/filesystem (encrypted or plain) and creates/mounts additional disks. Dispatches to OS-specific tasks for Debian, OmniOS/illumos, and Windows.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      show_help:
        type: bool
        default: true
        description: Whether to display help/informational output.
      vm_encrypted:
        type: bool
        default: false
        description: Whether the root disk uses LUKS encryption (selects the encrypted expansion path).
      root_unlock_key:
        type: str
        default: pass123
        description: LUKS passphrase used to resize the encrypted root volume (override in production).
      storage_device:
        type: str
        default: ""
        description: >-
          Explicit block device to partition, format and mount as dedicated data storage (e.g. /dev/sdb).
          Empty skips all data-storage tasks, so hosts without the disk can share the same configuration.
      storage_real_mount:
        type: str
        default: /srv/data
        description: Mount point of the dedicated data filesystem; subdirs are created here and bind-mounted into the consumer paths.
      storage_fstype:
        type: str
        default: xfs
        description: Filesystem created on the data partition when none exists; an existing filesystem is never reformatted and mounts with its detected type.
      storage_subdirs:
        type: list
        elements: dict
        default: []
        description: Subdirectories created on the real mount and bind-mounted into consumer paths. Each item has name (subdir on the real mount) and target (absolute path the bind mount appears at).
      storage_services:
        type: list
        elements: dict
        default: []
        description: Services that receive a systemd drop-in refusing to start when their required mounts are missing. Each item has name (service unit) and requires (list of mount paths).
