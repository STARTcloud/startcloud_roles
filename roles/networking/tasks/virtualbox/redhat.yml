---
## Intentionally empty: VirtualBox applies no EL-specific network configuration.
## The Debian twin writes netplan drop-ins and runs "netplan apply"; EL has no
## netplan, so none of that is portable and nothing has been written to replace it.
## The file is kept because tasks/redhat.yml dispatches to
## "virtualbox/{{ ansible_os_family | lower }}.yml" whenever the virtualization
## type is virtualbox — deleting it turns a declared platform into a
## missing-file failure.
- name: "Noting that VirtualBox applies no EL-specific network configuration"
  ansible.builtin.debug:
    msg: "VirtualBox on EL: no provider-specific network configuration is applied."
