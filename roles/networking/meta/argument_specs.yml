---
argument_specs:
  main:
    short_description: Post-boot network configuration
    description:
      - Orders network interfaces, writes adapter artifacts, configures DNS entries and NAT-to-static conversion across providers (bhyve, docker, utm, virtualbox) and OS families.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      show_help:
        type: bool
        default: true
        description: Whether to display help/debug output during the run.
      use_proxy:
        type: bool
        default: false
        description: Whether to route package/network operations through an HTTP proxy.
      proxy_port:
        type: int
        default: 3128
        description: Port of the HTTP proxy when use_proxy is true.
      proxy_server:
        type: str
        default: squid.mydomain.com
        description: Hostname of the HTTP proxy when use_proxy is true.
      convert_nat_dhcp_to_static:
        type: bool
        default: true
        description: Convert the NAT DHCP-assigned address into a static configuration.
      etc_hosts_entries:
        type: list
        elements: raw
        default: []
        description: Additional entries to append to /etc/hosts.
      dns_entries_list:
        type: list
        elements: str
        description: Service subdomain labels to register as DNS entries.
      completed_dir:
        type: str
        default: /vagrant/completed
        description: >-
          Directory the provisioner keeps its completion artifacts in. The role writes the selected IP into
          ipaddress.yml inside that directory and reads it back when no bridged adapter was configured. Defaulted
          here because the role also runs in the always-playbook, where no other role's defaults are loaded.
      settings:
        type: dict
        description: >-
          Provisioner context — instance settings supplied by the provisioner. Only hostname and domain are consumed:
          they build the canonical /etc/hosts record and the per-service DNS alias list derived from dns_entries_list.
      networks:
        type: list
        elements: dict
        description: >-
          Provisioner context — network definitions supplied by the provisioner (type, address, netmask, gateway,
          route, dhcp4, dhcp6, dns). networks[0] decides whether a public bridged adapter is configured and feeds the
          interface.yaml.j2 netplan template; when it is undefined the role falls back to the NAT/loopback path.
      ansible_module_running_in_container:
        type: bool
        description: >-
          Provisioner context — true when the target is a container. The role gathers it itself with
          community.docker.current_container_facts at the top of each OS task file, so it never has to be supplied;
          when true every stage is skipped, because a container has no netplan, no systemd-networkd and no adapters to
          reorder. A value supplied by the provisioner as a play or extra var outranks the gathered fact.
