---
run_tasks: true
show_help: true
## Where adapter-detail files are written for the support bundle. Duplicated
## from the setup role on purpose: this role also runs in the always-playbook,
## where setup is not listed and its defaults are not loaded.
completed_dir: /vagrant/completed
use_proxy: false
proxy_port: 3128
proxy_server: squid.mydomain.com
convert_nat_dhcp_to_static: true
etc_hosts_entries: []
dns_entries_list:
  - auth
  - notes
  - domino
  - traveler
  - verse
  - console
  - downloads
  - logging
  - welcome
  - proxy
  - sametime
  - leap
  - restapi
  - www
  - web-terminal
