---
run_tasks: true
show_help: true
## Records to publish; an empty list makes the role a no-op, which is the
## expected state for locally built machines that accept the generated key
dns_records: []
## Publish the service subdomains as CNAMEs to the first record, so SSL
## challenges can validate every SAN the ssl role puts on the certificate.
## Same list (and override point) as the networking and ssl roles.
dns_publish_aliases: true
dns_entries_list:
  - auth
  - notes
  - domino
  - traveler
  - verse
  - console
  - downloads
  - logging
  - welcome
  - proxy
  - sametime
  - leap
  - restapi
  - www
  - web-terminal
## TTL applied when a record does not specify its own (Cloudflare: 1 = automatic)
dns_default_ttl: 300
## Where records without an explicit value get their IP from:
##   adapter  - the public adapter IP gathered by the networking role
##   external - the IP as the internet sees it (NAT-safe), queried from dns_external_ip_url
dns_value_source: adapter
dns_external_ip_url: https://api.ipify.org
## Poll a public resolver over DNS-over-HTTPS until published records answer,
## so later roles (SSL HTTP-01 challenges) never race propagation
dns_verify_propagation: true
dns_verify_retries: 30
dns_verify_delay: 10
dns_doh_url: https://cloudflare-dns.com/dns-query
