---
- name: "Block to Allow Loading of Variables without running task"
  when:
    - run_tasks
    - dns_records | length > 0
  block:
    - name: "Determining external IP for DNS records"
      when: dns_value_source == 'external'
      ansible.builtin.uri:
        url: "{{ dns_external_ip_url }}"
        return_content: true
      register: dns_external_ip_result
      retries: 3
      delay: 5
      until: dns_external_ip_result.status == 200

    - name: "Setting default DNS record value"
      ansible.builtin.set_fact:
        dns_default_value: "{{ (dns_external_ip_result.content | trim) if dns_value_source == 'external' else (first_adapter_details.ip | default('')) }}"

    - name: "Ensuring a default record value exists"
      ansible.builtin.assert:
        that: dns_default_value | length > 0
        fail_msg: "No default DNS value available — networking facts missing; set dns_value_source: external or give records explicit values"

    ## dns_records arrives as a role var, which outranks set_fact — accumulate
    ## under a different fact name or the additions are silently discarded
    - name: "Seeding the effective DNS record list"
      ansible.builtin.set_fact:
        dns_effective_records: "{{ dns_records }}"

    - name: "Adding service alias records as CNAMEs to the primary record"
      when: dns_publish_aliases | bool
      vars:
        dns_primary: "{{ dns_effective_records | first }}"
      ansible.builtin.set_fact:
        dns_effective_records: "{{ dns_effective_records + [{'provider': dns_primary.provider, 'zone': dns_primary.zone, 'type': 'CNAME', 'name': alias ~ '.' ~ dns_primary.name, 'value': dns_primary.name ~ '.' ~ dns_primary.zone}] }}"
      loop: "{{ dns_entries_list }}"
      loop_control:
        loop_var: alias

    - name: "Grouping DNS records by provider"
      ansible.builtin.set_fact:
        dns_providers: "{{ dns_effective_records | map(attribute='provider') | unique | list }}"

    - name: "Including provider-specific tasks"
      ansible.builtin.include_tasks: "{{ dns_provider }}.yml"
      loop: "{{ dns_providers }}"
      loop_control:
        loop_var: dns_provider

    - name: "Verifying DNS propagation"
      when: dns_verify_propagation
      ansible.builtin.include_tasks: "verify.yml"
