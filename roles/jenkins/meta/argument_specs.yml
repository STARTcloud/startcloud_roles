---
argument_specs:
  main:
    short_description: Installs and configures a Jenkins CI server on Debian/Ubuntu.
    description:
      - Installs Jenkins from the upstream Debian repository, keyring-signed, together with its build dependencies.
      - The Java runtime is not installed here — Jenkins runs on the JDK the collection's sdkman_install and sdkman_java roles place in the service account's
        SDKMAN candidates tree, which they also register system-wide through update-alternatives. Run those two roles before this one.
      - Configures the service through a systemd drop-in, prepares filesystem permissions, bypasses the initial setup wizard and security realm, installs core
        plugins, configures git, and creates desktop launchers where a desktop session is present.
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      jenkins_java_home:
        type: str
        default: "/home/{{ vagrant_user }}/.sdkman/candidates/java/current"
        description: SDKMAN Java candidate the systemd drop-in exports as JAVA_HOME and prepends to the service PATH. Must be the candidate sdkman_java
          installed for the account Jenkins runs as.
