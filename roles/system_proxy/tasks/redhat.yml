---
## Same provider resolution as the Debian path: `proxy` entries are single-key
## dicts keyed by provider name, so `proxy[0].user` never resolved.
- name: "Setting proxy for yum"
  vars:
    proxy_pkg_entry: "{{ proxy | selectattr(proxy_package_manager_proxy, 'defined') | map(attribute=proxy_package_manager_proxy) | first }}"
    proxy_pkg_url: "socks5h://{{ proxy_pkg_entry.user }}:{{ proxy_pkg_entry.pass }}@{{ proxy_pkg_entry.host }}:{{ proxy_pkg_entry.port }}"
  ansible.builtin.lineinfile:
    path: /etc/yum.conf
    regexp: "^proxy="
    line: "proxy={{ proxy_pkg_url }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when: proxy_package_manager | bool

- name: "Setting system-wide proxy environment variables"
  vars:
    proxy_env_entry: "{{ proxy | selectattr(proxy_systemwide_proxy, 'defined') | map(attribute=proxy_systemwide_proxy) | first }}"
    proxy_env_url: "http://{{ proxy_env_entry.user }}:{{ proxy_env_entry.pass }}@{{ proxy_env_entry.host }}:{{ proxy_env_entry.port }}"
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: "^{{ item.split('=') | first }}="
    line: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - "http_proxy={{ proxy_env_url }}"
    - "https_proxy={{ proxy_env_url }}"
    - "ftp_proxy={{ proxy_env_url }}"
    - "no_proxy=localhost,127.0.0.1,localaddress,.localdomain.com"
  when: proxy_systemwide | bool
