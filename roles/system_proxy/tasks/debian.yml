---
## `proxy` entries are single-key dicts keyed by provider name, so the provider
## has to be resolved by key before user/pass/host/port can be read. Indexing
## `proxy[0]` flat could never see those keys.
## /etc/apt/apt.conf.d/proxy.conf ships with no package, so the drop-in has to be
## created rather than merely edited.
- name: "Ensuring that Proxy is Set for APT"
  vars:
    proxy_pkg_entry: "{{ proxy | selectattr(proxy_package_manager_proxy, 'defined') | map(attribute=proxy_package_manager_proxy) | first }}"
    proxy_pkg_credentials: "{{ (proxy_pkg_entry.user ~ ':' ~ proxy_pkg_entry.pass ~ '@') if proxy_pkg_entry.user | default('') | length > 0 else '' }}"
    proxy_pkg_url: "socks5h://{{ proxy_pkg_credentials }}{{ proxy_pkg_entry.host }}:{{ proxy_pkg_entry.port }}"
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/proxy.conf
    regexp: '^Acquire::http::Proxy'
    line: 'Acquire::http::Proxy "{{ proxy_pkg_url }}";'
    create: true
    owner: root
    group: root
    mode: "0644"
  when: proxy_package_manager | bool

## The provider is selected by `proxy_systemwide_proxy`; the old expression
## selected by that variable and then read `.squid` regardless, which pinned the
## task to squid no matter what the variable said.
- name: "Setting system-wide proxy environment variables"
  vars:
    proxy_env_entry: "{{ proxy | selectattr(proxy_systemwide_proxy, 'defined') | map(attribute=proxy_systemwide_proxy) | first }}"
    proxy_env_credentials: "{{ (proxy_env_entry.user ~ ':' ~ proxy_env_entry.pass ~ '@') if proxy_env_entry.user | default('') | length > 0 else '' }}"
    proxy_env_url: "http://{{ proxy_env_credentials }}{{ proxy_env_entry.host }}:{{ proxy_env_entry.port }}"
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: "^{{ item.split('=') | first }}="
    line: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - "http_proxy={{ proxy_env_url }}"
    - "https_proxy={{ proxy_env_url }}"
    - "ftp_proxy={{ proxy_env_url }}"
    - "no_proxy={{ proxy_no_proxy | join(',') }}"
  when: proxy_systemwide | bool

- name: "Handing the system-wide proxy to every sudo session"
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/proxy
    regexp: "^Defaults env_file="
    line: "Defaults env_file=/etc/environment"
    create: true
    owner: root
    group: root
    mode: "0440"
  when: proxy_systemwide | bool

- name: "Creating the systemd manager configuration directory"
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: proxy_systemd | bool

- name: "Setting the proxy environment of every systemd unit"
  vars:
    proxy_env_entry: "{{ proxy | selectattr(proxy_systemwide_proxy, 'defined') | map(attribute=proxy_systemwide_proxy) | first }}"
    proxy_env_credentials: "{{ (proxy_env_entry.user ~ ':' ~ proxy_env_entry.pass ~ '@') if proxy_env_entry.user | default('') | length > 0 else '' }}"
    proxy_env_url: "http://{{ proxy_env_credentials }}{{ proxy_env_entry.host }}:{{ proxy_env_entry.port }}"
  ansible.builtin.copy:
    content: |
      [Manager]
      DefaultEnvironment=http_proxy={{ proxy_env_url }} https_proxy={{ proxy_env_url }} no_proxy={{ proxy_no_proxy | join(',') }}
    dest: /etc/systemd/system.conf.d/proxy.conf
    owner: root
    group: root
    mode: "0644"
  register: proxy_systemd_conf
  when: proxy_systemd | bool

- name: "Reloading the systemd manager configuration"
  ansible.builtin.systemd_service:
    daemon_reexec: true
  when:
    - proxy_systemd | bool
    - proxy_systemd_conf.changed
