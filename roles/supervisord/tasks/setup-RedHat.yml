---
- name: "Installing required packages"
  ansible.builtin.dnf:
    name: "{{ supervisord_packages }}"
    state: present
    update_cache: true

- name: "Creating supervisord configuration directory"
  ansible.builtin.file:
    path: "{{ supervisord_include_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Copying supervisord configuration file"
  notify: Restart supervisord
  ansible.builtin.template:
    src: supervisord.conf.j2
    dest: "{{ supervisord_config_file }}"
    owner: root
    group: root
    mode: "0644"

- name: "Ensuring supervisord is started and enabled"
  when: supervisord_manage_service | bool
  ansible.builtin.service:
    name: "{{ supervisord_service_name }}"
    state: started
    enabled: true
