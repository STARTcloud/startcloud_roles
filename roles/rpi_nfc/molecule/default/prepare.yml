---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install build prerequisites the provisioner normally supplies
      ansible.builtin.apt:
        name:
          - build-essential
          - git
          - pkg-config
        state: present

    - name: Create the service account the nfc-daemon unit runs as
      ansible.builtin.user:
        name: startcloud
        shell: /bin/bash
        create_home: true
        state: present
