---
argument_specs:
  main:
    short_description: Install Flatpak and configure remotes
    description:
      - Installs the Flatpak package on Debian-family systems and registers the configured Flatpak remotes system-wide.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      flatpak_repos:
        type: list
        elements: dict
        default:
          - name: flathub
            url: "https://flathub.org/repo/flathub.flatpakrepo"
        description: Flatpak remotes to register system-wide, each with a name and a flatpakrepo url.
        options:
          name:
            type: str
            required: true
            description: Name the remote is registered under in the system-wide flatpak installation.
          url:
            type: str
            required: true
            description: URL of the .flatpakrepo file describing the remote.
