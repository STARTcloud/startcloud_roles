---
argument_specs:
  main:
    short_description: Configure NTP time synchronization and system timezone
    description:
      - Installs and configures an NTP implementation (traditional ntpd, chrony, or systemd-timesyncd depending on the platform).
      - Renders the daemon configuration from the role's upstream server list and sets the system timezone.
      - On an OPNsense firewall it writes the time servers and the timezone into the firewall's configuration with a
        PHP tool, the firewall having no API for them, and restarts ntpd through the API.
      - On an OpenWrt access point (inventory ansible_os_family openwrt, no facts gathered) it writes the time servers
        with uci and restarts sysntpd; on a Cisco IOS switch (ansible_os_family ios, connection network_cli) it writes
        the ntp server lines with cisco.ios.ios_config and saves the configuration.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      ntp_enabled:
        type: bool
        default: true
        description: Whether the NTP daemon is started and enabled (false stops and disables it).
      ntp_engine:
        type: str
        default: ""
        choices: ["", timesyncd, ntp, chrony]
        description: >-
          The time daemon the role installs and configures; empty takes the platform's own default (systemd-timesyncd on
          Debian 13 and later, ntp on older Debian, chrony on EL, ntpd on FreeBSD and OmniOS).
      ntp_timezone:
        type: str
        default: America/Chicago
        description: System timezone to set on the host.
      ntp_manage_config:
        type: bool
        default: false
        description: Whether the role renders and manages the NTP daemon configuration file.
      ntp_area:
        type: str
        default: ""
        description: NTP pool area code used to select regional pool servers.
      ntp_servers:
        type: list
        elements: str
        default:
          - "ntp1.prominic.net iburst"
          - "ntp2.prominic.net iburst"
        description: Upstream NTP servers written into the daemon configuration.
      ntp_restrict:
        type: list
        elements: str
        default:
          - "127.0.0.1"
          - "::1"
        description: Restrict entries rendered into the traditional ntp.conf.
      ntp_cron_handler_enabled:
        type: bool
        default: false
        description: Whether the cron service is restarted after the timezone changes.
      ntp_tinker_panic:
        type: bool
        default: false
        description: When true, adds "tinker panic 0" to ntp.conf so the clock always steps (useful for paused VMs).
      ntp_opnsense_tools_dir:
        type: str
        default: /conf/ansible/tools
        description: Directory on an OPNsense firewall the time server tool is placed in.
      opnsense_api_port:
        type: int
        default: 443
        description: Port the OPNsense web GUI and API listen on.
      opnsense_api_url:
        type: str
        description: Base address of the OPNsense API; defaults to https://<inventory_hostname>:<opnsense_api_port>/api.
      opnsense_api_key:
        type: str
        default: ""
        description: OPNsense API key the ntpd restart signs in with.
      opnsense_api_secret:
        type: str
        default: ""
        description: Secret of opnsense_api_key.
      opnsense_api_validate_certs:
        type: bool
        default: true
        description: Whether the firewall's web GUI certificate is checked on API calls.
