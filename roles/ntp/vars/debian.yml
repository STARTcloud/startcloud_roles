---
__ntp_default_engine: "{{ 'timesyncd' if ansible_distribution_major_version | int >= 13 else 'ntp' }}"
__ntp_engine: "{{ ntp_engine if ntp_engine | length > 0 else __ntp_default_engine }}"
__use_systemd_timesyncd: "{{ __ntp_engine == 'timesyncd' }}"
__ntp_daemon: "{{ {'timesyncd': 'systemd-timesyncd', 'ntp': 'ntp', 'chrony': 'chrony'}[__ntp_engine] }}"
ntp_tzdata_package: tzdata
__ntp_package: "{{ {'timesyncd': 'systemd-timesyncd', 'ntp': 'ntp', 'chrony': 'chrony'}[__ntp_engine] }}"
__ntp_config_file: "{{ {'timesyncd': '/etc/systemd/timesyncd.conf', 'ntp': '/etc/ntp.conf', 'chrony': '/etc/chrony/chrony.conf'}[__ntp_engine] }}"
__ntp_driftfile: "{{ '/var/lib/chrony/chrony.drift' if __ntp_engine == 'chrony' else '/var/lib/ntp/drift' }}"
__ntp_config_template: "{{ 'chrony-debian.conf.j2' if __ntp_engine == 'chrony' else (__ntp_config_file | basename) ~ '.j2' }}"
ntp_cron_daemon: cron
