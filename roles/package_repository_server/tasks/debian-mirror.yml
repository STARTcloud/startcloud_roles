---
## Debian mirror — debmirror into {{ pkg_server_base_dir }}/mirror/debian
## nightly, served by the shared vhost at /mirror/ with autoindex.
## cron carries the crontab binary the schedule below is written with; a
## minimal image does not necessarily ship it.
- name: "Installing debmirror, cron and nginx"
  ansible.builtin.apt:
    name:
      - debmirror
      - cron
      - nginx
    state: present

- name: "Creating the mirror service account"
  ansible.builtin.user:
    name: mirror
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: "Creating the mirror directory"
  ansible.builtin.file:
    path: "{{ pkg_server_base_dir }}/mirror"
    state: directory
    owner: mirror
    mode: "0755"

- name: "Installing the mirror synchronisation script"
  ansible.builtin.template:
    src: mirror_deb_repo.sh.j2
    dest: "{{ pkg_server_base_dir }}/mirror_deb_repo.sh"
    mode: "0755"

- name: "Seeding the mirror index page"
  ansible.builtin.copy:
    src: mirror-index.html
    dest: "{{ pkg_server_base_dir }}/mirror/index.html"
    force: false
    mode: "0644"

- name: "Scheduling the nightly mirror synchronisation"
  ansible.builtin.cron:
    name: "Debian mirror sync"
    cron_file: local-debmirror
    user: root
    minute: "{{ pkg_server_mirror_cron_minute }}"
    hour: "{{ pkg_server_mirror_cron_hour }}"
    weekday: "1-7"
    job: "{{ pkg_server_base_dir }}/mirror_deb_repo.sh"
