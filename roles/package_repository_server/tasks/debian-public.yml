---
## Public landing page for the tree the vhost serves at /public/. The signed
## repository underneath it (/public/debian) is built by debian-base.yml.
- name: "Creating the public landing page directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - "{{ pkg_server_base_dir }}/public"
    - "{{ pkg_server_base_dir }}/public/css"

- name: "Seeding the public repository index page"
  ansible.builtin.copy:
    src: public-index.html
    dest: "{{ pkg_server_base_dir }}/public/index.html"
    force: false
    mode: "0644"

- name: "Seeding the public repository stylesheet"
  ansible.builtin.copy:
    src: public-css/STARTcloud.css
    dest: "{{ pkg_server_base_dir }}/public/css/STARTcloud.css"
    force: false
    mode: "0644"
