---
argument_specs:
  main:
    short_description: Package repository server
    description:
      - Builds and serves OS package repositories — OmniOS IPS pkg server instances and the STARTcloud Debian package
        server (a signed public APT repository, a Debian mirror and an mTLS-gated private APT repository) behind a
        single path-based nginx vhost.
        Additional structures (pkg_server, storage_disk) are supplied externally by the calling play.
        main.yml always runs the OS base tasks, then on OmniOS the archive tasks selected by pkg_server.type and on
        Debian the trees selected by the pkg_server_*_enabled toggles, and finally renders the shared vhost.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      package_server_email:
        type: str
        description: Email address embedded in the generated PGP signing key.
      service_home_dir:
        type: str
        default: /home/startcloud
        description: Home directory of the STARTcloud service account the built deb is published from.
      pkg_server_base_dir:
        type: str
        default: /local
        description: Content parent holding the public, mirror, private, clients, ca, pgp and staging trees.
      pkg_server_domain:
        type: str
        default: debian.startcloud.com
        description: Primary server name of the package server vhost; also names the vhost file and the TLS certificate.
      pkg_server_legacy_domains:
        type: list
        elements: str
        default: []
        description: Additional server names appended to the vhost so retired hostnames keep serving during migration.
      pkg_server_ssl_enabled:
        type: bool
        default: true
        description: Render the port-80 redirect plus the port-443 server block (requires the referenced certificates
          to exist). When false a single plain port-80 server block is rendered instead.
      pkg_server_ssl_certificate:
        type: str
        description: TLS certificate path (defaults to the certbot live path for pkg_server_domain).
      pkg_server_ssl_certificate_key:
        type: str
        description: TLS key path (defaults to the certbot live path for pkg_server_domain).
      pkg_server_public_enabled:
        type: bool
        default: true
        description: Seed the public landing page and stylesheet served at /public/.
      pkg_server_mirror_enabled:
        type: bool
        default: false
        description: Provision the debmirror tree and its nightly sync, served at /mirror/.
      pkg_server_private_enabled:
        type: bool
        default: false
        description: Provision the client-certificate CA and the private tree, served at /private/ and /certs/ behind
          mTLS verification.
      pkg_server_public_dir:
        type: str
        description: Root of the signed public APT repository (defaults to <base_dir>/public/debian).
      pkg_server_deb_source:
        type: str
        description: Path of the deb (built by the debian_packager role) published into the public repository.
      pkg_server_staging_dir:
        type: str
        description: Directory the repository indexes are rendered in before publication (defaults to <base_dir>/staging).
      pkg_server_gnupg_dir:
        type: str
        description: GNUPGHOME the repository signing key is generated in and signed from (defaults to <base_dir>/pgp/gnupg).
      pkg_server_apt_source_url:
        type: str
        description: Base URL the host points its own apt at to prove the published repository is consumable.
      pkg_server_ca_cn:
        type: str
        default: STARTcloud Package Repository CA
        description: Common name of the private repository client-certificate CA.
      pkg_server_ca_days:
        type: int
        default: 3650
        description: Validity in days of the generated CA certificate.
      pkg_server_client_cert_days:
        type: int
        default: 365
        description: Validity in days of the client certificates generate_client_cert.sh issues.
      pkg_server_mirror_source_host:
        type: str
        default: mirrors.ocf.berkeley.edu
        description: Upstream Debian mirror debmirror pulls from.
      pkg_server_mirror_dists:
        type: str
        default: bullseye,bookworm,trixie
        description: Comma-separated Debian distributions to mirror.
      pkg_server_mirror_sections:
        type: str
        default: main,contrib,non-free,non-free-firmware,main/debian-installer
        description: Comma-separated repository sections to mirror.
      pkg_server_mirror_arches:
        type: str
        default: amd64,arm64
        description: Comma-separated architectures to mirror.
      pkg_server_mirror_cron_minute:
        type: str
        default: "30"
        description: Cron minute for the nightly mirror synchronisation.
      pkg_server_mirror_cron_hour:
        type: str
        default: "2"
        description: Cron hour for the nightly mirror synchronisation.
