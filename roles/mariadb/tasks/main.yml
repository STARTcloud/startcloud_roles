---
- name: "Block to Allow Loading of Variables without running task"
  when: run_tasks
  block:
    - name: "Installing MariaDB"
      ansible.builtin.apt:
        name:
          - mariadb-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: "Starting MariaDB"
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true

    # Queried through the module rather than the mysql CLI so the credentials the
    # role sets below are used — a bare CLI call only works while root is still
    # socket-authenticated, which stops being true once the password is applied.
    - name: "Checking whether the test database still exists"
      become: true
      ansible.mysql.mysql_info:
        login_user: "{{ mariadb_admin_user }}"
        login_password: "{{ mariadb_admin_pass }}"
        login_unix_socket: "{{ mariadb_login_unix_socket }}"
        filter:
          - databases
      register: mariadb_server_info

    # mysql_secure_installation is interactive-only and always reports changed,
    # so it runs once — the test database it removes doubles as the marker.
    - name: "Securing MariaDB"
      become: true
      when: "'test' in mariadb_server_info.databases"
      ansible.builtin.expect:
        command: mysql_secure_installation
        responses:
          "Enter current password for root \\(enter for none\\): ": ""
          "Switch to unix_socket authentication \\[Y\\/n\\] ": "n"
          "Change the root password\\? \\[Y\\/n\\] ": "y"
          "New password:": "{{ mariadb_admin_pass }}"
          "Re-enter new password:": "{{ mariadb_admin_pass }}"
          "Remove anonymous users\\? \\[Y\\/n\\]": "y"
          "Disallow root login remotely\\? \\[Y\\/n\\]": "n"
          "Remove test database and access to it\\? \\[Y\\/n\\]": "y"
          "Reload privilege tables now\\? \\[Y\\/n\\]": "y"

    # The module has to be pointed at the unix socket: a TCP connection to localhost
    # is rejected with 1698 while the account is still socket-authenticated, and the
    # credentials cover the run after the password has been applied.
    - name: "Setting the password for {{ mariadb_admin_user }}"
      become: true
      ansible.mysql.mysql_user:
        name: "{{ mariadb_admin_user }}"
        password: "{{ mariadb_admin_pass }}"
        host: localhost
        login_user: "{{ mariadb_admin_user }}"
        login_password: "{{ mariadb_admin_pass }}"
        login_unix_socket: "{{ mariadb_login_unix_socket }}"

    - name: "Configuring MariaDB to bind to all ports"
      notify: Restarting MariaDB
      ansible.builtin.lineinfile:
        mode: "0644"
        path: "{{ item.dir }}"
        regexp: "^bind-address"
        create: true
        line: "bind-address  = 0.0.0.0"
      with_items:
        - { dir: "/etc/mysql/mariadb.conf.d/50-server.cnf" }
