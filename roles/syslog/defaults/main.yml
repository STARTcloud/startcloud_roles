---
run_tasks: true

syslog_enabled: true
syslog_forward: true
syslog_server: ""
syslog_port: 514
syslog_protocol: udp
syslog_selector: "*.*"
syslog_config_file: /etc/rsyslog.d/10-remote.conf
syslog_queue_name: remote
syslog_queue_max_disk: 256m
syslog_tls_ca: /etc/ssl/certs/ca-certificates.crt
syslog_tls_peer: "{{ syslog_server }}"
syslog_receive_udp: false
syslog_receive_udp_port: 514
syslog_receive_tcp: false
syslog_receive_tcp_port: 514
syslog_receive_tls: false
syslog_receive_tls_port: 6514
syslog_receive_tls_cert: ""
syslog_receive_tls_key: ""
syslog_receive_log_dir: /var/log/remote
syslog_receive_config_file: /etc/rsyslog.d/10-receive.conf
opnsense_api_port: 443
opnsense_api_url: "https://{{ inventory_hostname }}:{{ opnsense_api_port }}/api"
opnsense_api_key: ""
opnsense_api_secret: ""
opnsense_api_validate_certs: true
