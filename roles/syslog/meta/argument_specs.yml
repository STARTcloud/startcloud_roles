---
argument_specs:
  main:
    short_description: Forward system logs to a central syslog collector
    description:
      - Installs rsyslog where the platform ships it and writes one forwarding rule to the collector, over UDP, TCP or TLS.
      - On the collector it writes the receiving rules, one file per sending host, over UDP and TLS.
      - On OmniOS it installs rsyslog, makes it the system logger in place of the legacy syslogd (which sends no hostname) and writes the same rule.
      - On OPNsense the rule is one remote destination, written through the firewall's API with an API key.
      - On an OpenWrt access point (inventory ansible_os_family openwrt, no facts gathered) the rule is logd's log_ip,
        log_port and log_proto, written with uci; on a Cisco IOS switch (ansible_os_family ios, connection network_cli)
        it is the logging host line, written with cisco.ios.ios_config; both take udp or tcp.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      syslog_enabled:
        type: bool
        default: true
        description: Whether the system logger is started and enabled.
      syslog_forward:
        type: bool
        default: true
        description: Whether the forwarding rule is written; false removes it (the collector itself sets this false).
      syslog_server:
        type: str
        default: ""
        description: Collector address every log line is forwarded to; empty writes no rule.
      syslog_port:
        type: int
        default: 514
        description: Collector port.
      syslog_protocol:
        type: str
        default: udp
        choices: [udp, tcp, tls]
        description: >-
          Transport to the collector. tcp and tls hold every line in a disk-backed queue until the collector takes it;
          tls also verifies the collector's certificate name against syslog_tls_peer. udp sends once and keeps nothing.
      syslog_queue_name:
        type: str
        default: remote
        description: File name prefix of the forwarding queue in the rsyslog work directory (tcp and tls).
      syslog_queue_max_disk:
        type: str
        default: 256m
        description: Most disk the forwarding queue may use while the collector is unreachable (tcp and tls).
      syslog_selector:
        type: str
        default: "*.*"
        description: Facility and priority selector of the lines forwarded.
      syslog_config_file:
        type: str
        default: /etc/rsyslog.d/10-remote.conf
        description: File the forwarding rule is written to on rsyslog platforms.
      syslog_tls_ca:
        type: str
        default: /etc/ssl/certs/ca-certificates.crt
        description: CA bundle the sender validates the collector's certificate against.
      syslog_tls_peer:
        type: str
        description: Name the collector's certificate must carry; defaults to syslog_server.
      syslog_receive_udp:
        type: bool
        default: false
        description: Receive plain UDP syslog from other hosts into one file per sender (the collector sets this true).
      syslog_receive_udp_port:
        type: int
        default: 514
        description: UDP port the collector listens on.
      syslog_receive_tcp:
        type: bool
        default: false
        description: Receive plain TCP syslog from other hosts into one file per sender.
      syslog_receive_tcp_port:
        type: int
        default: 514
        description: TCP port the plain listener binds.
      syslog_receive_tls:
        type: bool
        default: false
        description: Receive TLS syslog from other hosts into one file per sender, serving syslog_receive_tls_cert.
      syslog_receive_tls_port:
        type: int
        default: 6514
        description: TCP port the TLS listener binds.
      syslog_receive_tls_cert:
        type: str
        default: ""
        description: Full-chain certificate the TLS listener serves.
      syslog_receive_tls_key:
        type: str
        default: ""
        description: Private key of syslog_receive_tls_cert.
      syslog_receive_log_dir:
        type: str
        default: /var/log/remote
        description: Directory the collector writes one file per sending host into.
      syslog_receive_config_file:
        type: str
        default: /etc/rsyslog.d/10-receive.conf
        description: File the receiving rules are written to.
      opnsense_api_port:
        type: int
        default: 443
        description: Port the OPNsense web GUI and API listen on.
      opnsense_api_url:
        type: str
        description: Base address of the OPNsense API; defaults to https://<inventory_hostname>:<opnsense_api_port>/api.
      opnsense_api_key:
        type: str
        default: ""
        description: OPNsense API key the lane signs in with.
      opnsense_api_secret:
        type: str
        default: ""
        description: Secret of opnsense_api_key.
      opnsense_api_validate_certs:
        type: bool
        default: true
        description: Whether the firewall's web GUI certificate is checked on API calls.
