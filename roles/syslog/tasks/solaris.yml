---
- name: "Ensuring the system logger is installed"
  community.general.pkg5:
    name: "{{ syslog_package }}"
    state: present
  register: syslog_install

- name: "Creating the directory the forwarding queue is kept in"
  ansible.builtin.file:
    path: "{{ syslog_work_directory }}"
    state: directory
    owner: root
    group: sys
    mode: "0700"
  when: syslog_protocol != 'udp'

- name: "Writing the forwarding rule"
  ansible.builtin.template:
    src: remote.conf.j2
    dest: "{{ syslog_config_file }}"
    owner: root
    group: sys
    mode: "0644"
  notify: "Restarting syslog"
  when:
    - syslog_forward | bool
    - syslog_server | length > 0

- name: "Removing the forwarding rule"
  ansible.builtin.file:
    path: "{{ syslog_config_file }}"
    state: absent
  notify: "Restarting syslog"
  when: not (syslog_forward | bool) or syslog_server | length == 0

- name: "Ensuring the legacy system logger is stopped and disabled"
  ansible.builtin.service:
    name: "{{ syslog_legacy_daemon }}"
    state: stopped
    enabled: false
  when: syslog_enabled | bool

- name: "Ensuring the system logger is running and enabled"
  ansible.builtin.service:
    name: "{{ syslog_daemon }}"
    state: started
    enabled: true
  when:
    - syslog_enabled | bool
    - not (ansible_check_mode and syslog_install is changed)

- name: "Ensuring the system logger is stopped and disabled"
  ansible.builtin.service:
    name: "{{ syslog_daemon }}"
    state: stopped
    enabled: false
  when:
    - not (syslog_enabled | bool)
    - not (ansible_check_mode and syslog_install is changed)
