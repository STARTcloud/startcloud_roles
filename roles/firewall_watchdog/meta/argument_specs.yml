---
argument_specs:
  main:
    short_description: pfSense Service_Watchdog configuration
    description:
      - Writes Service_Watchdog entries into a pfSense appliance's config.xml and reloads the
        configuration. Requires the pfSense-pkg-Service_Watchdog package (install via the
        dependencies role). On Linux hosts the monit role covers the same concept.
      - Appliances run Python 3.7 — keep the controller on ansible-core 2.16.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      firewall_watchdog_services:
        type: list
        elements: dict
        description: Watchdog entries (name, rcfile, status_command, executable, description, optional notify).
