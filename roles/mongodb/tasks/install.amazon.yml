---
- name: "Adding YUM repository"
  ansible.builtin.template:
    src: mongodb.repo.j2
    dest: "/etc/yum.repos.d/mongodb-org-{{ mongodb_major_version }}.repo"
    owner: root
    group: root
    mode: "0644"
  when: mongodb_package == 'mongodb-org'

- name: "Installing MongoDB package"
  ansible.builtin.dnf:
    name: "{{ mongodb_package }}{% if (mongodb_version | length > 3) %}-{{ mongodb_version }}{% endif %}"
    state: "{{ mongodb_package_state }}"
    lock_timeout: "{{ yum_lock_timeout }}"

- name: "Installing numactl package"
  ansible.builtin.dnf:
    name: numactl
    state: present
    lock_timeout: "{{ yum_lock_timeout }}"
  when: mongodb_use_numa | bool

- name: "Installing PyMongo package"
  ansible.builtin.dnf:
    name: "{{ mongodb_pymongo_package }}"
    state: present
    lock_timeout: "{{ yum_lock_timeout }}"
  when: not mongodb_pymongo_from_pip | bool

- name: "Installing PIP"
  ansible.builtin.dnf:
    name: "{{ mongodb_pymongo_deps }}"
    state: present
    lock_timeout: "{{ yum_lock_timeout }}"
  when: mongodb_pymongo_from_pip | bool

- name: "Installing PyMongo from PIP"
  ansible.builtin.pip:
    name: pymongo
    state: "{{ 'present' if mongodb_pymongo_pip_version else 'latest' }}"
    version: "{{ mongodb_pymongo_pip_version | default(omit, true) }}"
    executable: "{{ mongodb_pip_executable }}"
  when: mongodb_pymongo_from_pip | bool
