---
- name: Converge
  hosts: all
  become: true
  vars:
    run_tasks: true

    # Credentials — literal placeholder secrets for the test container only.
    mysql_root_password: "CHANGEME"
    mysql_user_password: "CHANGEME"

    # Keep the engine small enough for a CI container.
    mysql_innodb_buffer_pool_size: "64M"
    mysql_innodb_log_file_size: "16M"
    mysql_key_buffer_size: "32M"
    mysql_max_connections: "50"
    mysql_table_open_cache: "64"

    mysql_databases:
      - name: startcloud_test
        encoding: utf8mb4
        collation: utf8mb4_general_ci

    mysql_users:
      - name: startcloud_app
        host: localhost
        password: "CHANGEME"
        priv: "startcloud_test.*:ALL"

    # Minimal provisioner-context stand-ins so the role runs standalone.
    settings:
      hostname: startcloud-mysql-debian12
      domain: local
  roles:
    - role: mysql
