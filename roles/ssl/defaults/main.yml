---
run_tasks: true

# Certificate directory paths
win_cert_dir: "C:\\secure"
cert_dir: "/secure"

# Certificate generation settings
selfsigned_enabled: false
generate_self_signed_certificate_authority: false
letsencrypt_enabled: false
letsencrypt_staging_enabled: false

# Certificate passwords
cert_pass: ThisNeedstoBeSecure!
# Matches the encrypted intermediate key shipped in the driver's ssls/ca
ca_cert_pass: STARTcloud24@!

# Certificate properties
countrycode: US
organization: "{{ domino_organization | default('DEMO') }}"

# Java and keystore settings (Windows)
java_version: "latest"
java_home: "C:\\Program Files\\OpenJDK\\jdk-22.0.2"
java_keytool: "C:\\Program Files\\OpenJDK\\jdk-22.0.2\\bin\\keytool.exe"

# OpenSSL binary (Windows). Used for self-signed server cert generation when this
# path exists; if it is absent the ssl role falls back to native PowerShell .NET
# crypto. Provided by Git for Windows (added to the STARTcloud chocolatey packages).
openssl_bin: "C:\\Program Files\\Git\\usr\\bin\\openssl.exe"

# Private key settings
private_key_type: RSA
private_key_size: 4096

# Windows Certificate Store settings
cert_store_name: TrustedPublisher
cert_store_location: LocalMachine
cert_key_storage: machine
cert_key_exportable: true

# Variables for Role Certbot certs.
certbot_create_if_missing: false
certbot_create_method: standalone
certbot_admin_email: "support@startcloud.com"
certbot_create_standalone_stop_services:
  - nginx

# FreeBSD firewall appliances (pfSense/OPNsense)
# Existing-cert mode pushes from the controller-side cert store in the
# fleet's per-host layout ({{ cert_dir }}/<fqdn>/{host.pem,host.key,cacert.pem});
# the acme package path is driven by letsencrypt_enabled and the account vars
# below. ssl_appliance_cert_dir is the on-appliance destination the acme
# package, webConfigurator, fwauthserver and gbauthd all consume.
ssl_appliance_cert_dir: /conf/acme
ssl_appliance_tools_dir: /conf/ansible/tools
ssl_appliance_keytool: /usr/local/openjdk8-jre/bin/keytool
ssl_acme_cleanup: false
ssl_acme_account_name: CHANGEME
ssl_acme_account_email: changeme@example.com
ssl_acme_account_key: "{{ vault_ssl_acme_account_key | default('CHANGEME') }}"
ssl_acme_server: letsencrypt-production-2
