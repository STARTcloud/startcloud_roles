---
driver:
  name: docker
platforms:
  - name: startcloud-ssl-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    # The role skips ~50 tasks per run (the self-signed and Let's Encrypt
    # branches); hiding skipped/ok hosts keeps the run log readable.
    ANSIBLE_DISPLAY_SKIPPED_HOSTS: "false"
    ANSIBLE_DISPLAY_OK_HOSTS: "false"
verifier:
  name: ansible
