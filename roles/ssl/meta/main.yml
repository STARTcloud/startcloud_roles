---
galaxy_info:
  role_name: ssl
  author: Mark Gilbert
  description: >-
    Provisions TLS material — imports an existing cert, generates a self-signed CA/cert, or obtains Let's Encrypt
    certs — builds PFX/PEM/JKS bundles on Debian/Ubuntu, FreeBSD appliances and Windows, and pushes a certbot
    lineage to any node's certificate directory with its renewal hooks, and to FortiGate and NetScaler over their APIs.
  company: STARTcloud
  issue_tracker_url: https://github.com/STARTcloud/startcloud_roles/issues
  license: GPL-2.0-or-later
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions: ["bookworm", "trixie"]
    - name: Ubuntu
      versions: ["jammy", "noble"]
    - name: FreeBSD
      versions: ["14.0"]
    - name: Windows
      versions: ["2022"]
  galaxy_tags:
    - ssl
    - tls
    - certificates
    - letsencrypt
    - pki
dependencies: []
collections:
  - startcloud.startcloud_roles
