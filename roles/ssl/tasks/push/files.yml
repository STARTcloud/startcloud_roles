---
- name: "Reading the lineage certificate"
  community.crypto.x509_certificate_info:
    path: "{{ ssl_push_lineage }}/cert.pem"
  delegate_to: localhost
  become: false
  register: ssl_push_files_lineage

- name: "Creating the certificate directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ssl_push_files_owner }}"
    group: "{{ ssl_push_files_group }}"
    mode: "0755"
  loop:
    - "{{ cert_dir }}"
    - "{{ cert_dir }}/crt"
    - "{{ cert_dir }}/key"
    - "{{ cert_dir }}/combined"
    - "{{ cert_dir }}/renewal-hooks.d"

- name: "Installing the certificate chain"
  ansible.builtin.copy:
    src: "{{ ssl_push_lineage }}/fullchain.pem"
    dest: "{{ cert_dir }}/crt/{{ ssl_push_files_name }}.crt"
    owner: "{{ ssl_push_files_owner }}"
    group: "{{ ssl_push_files_group }}"
    mode: "0644"
  register: ssl_push_files_crt

- name: "Installing the private key"
  ansible.builtin.copy:
    src: "{{ ssl_push_lineage }}/privkey.pem"
    dest: "{{ cert_dir }}/key/{{ ssl_push_files_name }}.key"
    owner: "{{ ssl_push_files_owner }}"
    group: "{{ ssl_push_files_group }}"
    mode: "0600"
  register: ssl_push_files_key

- name: "Assembling the combined certificate"
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', ssl_push_lineage ~ '/fullchain.pem') }}\n{{ lookup('ansible.builtin.file', ssl_push_lineage ~ '/privkey.pem') }}\n"
    dest: "{{ cert_dir }}/combined/{{ ssl_push_files_name }}.pem"
    owner: "{{ ssl_push_files_owner }}"
    group: "{{ ssl_push_files_group }}"
    mode: "0600"
  register: ssl_push_files_combined

- name: "Installing the renewal hooks consumers run after a republish"
  ansible.builtin.template:
    src: ssl_renewal_hook.sh.j2
    dest: "{{ cert_dir }}/renewal-hooks.d/{{ ssl_renewal_hook.name }}.sh"
    owner: root
    group: root
    mode: "0750"
  loop: "{{ ssl_renewal_hooks }}"
  loop_control:
    loop_var: ssl_renewal_hook
    label: "{{ ssl_renewal_hook.name }}"

- name: "Reading the renewal hooks"
  ansible.builtin.find:
    paths: "{{ cert_dir }}/renewal-hooks.d"
    patterns: "*.sh"
  register: ssl_push_files_hooks

- name: "Running the renewal hooks"
  ansible.builtin.command: "{{ item.path }}"
  loop: "{{ ssl_push_files_hooks.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: true
  when: ssl_push_files_crt.changed or ssl_push_files_key.changed or ssl_push_files_combined.changed

- name: "Reading the installed certificate"
  community.crypto.x509_certificate_info:
    path: "{{ cert_dir }}/crt/{{ ssl_push_files_name }}.crt"
  register: ssl_push_files_installed

- name: "Verifying the installed certificate matches the lineage"
  ansible.builtin.assert:
    that:
      - ssl_push_files_installed.fingerprints.sha256 == ssl_push_files_lineage.fingerprints.sha256
    fail_msg: "{{ cert_dir }}/crt/{{ ssl_push_files_name }}.crt holds a certificate other than {{ ssl_push_lineage }}/cert.pem"
