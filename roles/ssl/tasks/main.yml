---
- name: "Block to Allow Loading of Variables without running task"
  when: run_tasks
  block:
    - name: "Including the lineage push tasks"
      ansible.builtin.include_tasks: push/lineage.yml
      when: ssl_push | bool

    - name: "Including the FortiGate push tasks"
      ansible.builtin.include_tasks: push/fortigate.yml
      when: ssl_push_fortigate | bool

    - name: "Including the NetScaler push tasks"
      ansible.builtin.include_tasks: push/netscaler.yml
      when: ssl_push_netscaler | bool

    - name: "Including OS-specific tasks"
      ansible.builtin.include_tasks: "{{ ansible_os_family | lower }}.yml"
      when:
        - ansible_os_family is defined
        - not (ssl_push | bool)
        - not (ssl_push_fortigate | bool)
        - not (ssl_push_netscaler | bool)
