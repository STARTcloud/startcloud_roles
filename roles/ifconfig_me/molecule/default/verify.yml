---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert the configured ifconfig_me packages were installed
      ansible.builtin.assert:
        that:
          - "'curl' in ansible_facts.packages"
          - "'ca-certificates' in ansible_facts.packages"
        fail_msg: "curl and/or ca-certificates are not installed"
        success_msg: "curl and ca-certificates are installed"

    - name: Stat the curl executable
      ansible.builtin.stat:
        path: /usr/bin/curl
      register: ifconfig_me_curl_binary

    - name: Assert the curl executable is present and executable
      ansible.builtin.assert:
        that:
          - ifconfig_me_curl_binary.stat.exists
          - ifconfig_me_curl_binary.stat.executable
        fail_msg: "/usr/bin/curl is missing or not executable"
        success_msg: "/usr/bin/curl is present and executable"

    - name: Assert the package manager reports an installed curl version
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['curl'][0].version is defined
          - ansible_facts.packages['curl'][0].version | length > 0
        fail_msg: "curl is present but dpkg reports no installed version"
        success_msg: "curl {{ ansible_facts.packages['curl'][0].version }} is installed"

    - name: Stat the CA certificate bundle installed alongside curl
      ansible.builtin.stat:
        path: /etc/ssl/certs/ca-certificates.crt
      register: ifconfig_me_ca_bundle

    - name: Assert the CA bundle needed for HTTPS public-IP lookups exists
      ansible.builtin.assert:
        that:
          - ifconfig_me_ca_bundle.stat.exists
          - ifconfig_me_ca_bundle.stat.size > 0
        fail_msg: "/etc/ssl/certs/ca-certificates.crt is missing or empty"
        success_msg: "/etc/ssl/certs/ca-certificates.crt is present and populated"
