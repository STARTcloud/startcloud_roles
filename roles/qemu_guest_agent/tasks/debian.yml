---
- name: "Including OS-specific vars"
  ansible.builtin.include_vars: "{{ ansible_os_family | lower }}.yml"

- name: "Installing the QEMU Guest Agent"
  ansible.builtin.apt:
    name: "{{ qemu_ga_package }}"
    state: present

## The stock unit hard-binds to the virtio device and cannot start without
## it; the per-transport units below replace it so one image serves both
## bhyve (virtio-serial) and VirtualBox (ISA serial) hosts simultaneously.
## It ships static (no [Install] section, udev pulls it in), so `disable`
## is a no-op systemd reports every run - masking is what actually keeps it
## off the virtio channel our own unit owns, and it converges.
- name: "Stopping the stock qemu-guest-agent unit"
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: stopped

- name: "Masking the stock qemu-guest-agent unit"
  ansible.builtin.systemd:
    name: qemu-guest-agent
    masked: true

- name: "Installing the virtio-serial transport unit"
  ansible.builtin.template:
    src: qemu-ga-virtio.service.j2
    dest: /etc/systemd/system/qemu-ga-virtio.service
    mode: "0644"
  when: qemu_ga_virtio_enabled

- name: "Installing the ISA serial transport unit"
  ansible.builtin.template:
    src: qemu-ga-serial.service.j2
    dest: /etc/systemd/system/qemu-ga-serial.service
    mode: "0644"
  when: qemu_ga_serial_enabled

- name: "Checking for the virtio-serial guest agent channel"
  ansible.builtin.stat:
    path: "{{ qemu_ga_virtio_device }}"
  register: qemu_ga_virtio_channel
  when: qemu_ga_virtio_enabled

- name: "Checking for the ISA serial guest agent port"
  ansible.builtin.stat:
    path: "{{ qemu_ga_serial_device }}"
  register: qemu_ga_serial_port
  when: qemu_ga_serial_enabled

- name: "Enabling the virtio-serial transport"
  ansible.builtin.systemd:
    name: qemu-ga-virtio
    enabled: true
    daemon_reload: true
  when: qemu_ga_virtio_enabled

- name: "Enabling the ISA serial transport"
  ansible.builtin.systemd:
    name: qemu-ga-serial
    enabled: true
    daemon_reload: true
  when: qemu_ga_serial_enabled

## Both units carry ConditionPathExists on their device, so starting one
## whose device is absent leaves it inactive and reports changed on every
## rerun. Enable is unconditional (the device may appear at the next boot
## on another hypervisor); the start only runs where the device is here.
- name: "Starting the virtio-serial transport where its channel device exists"
  ansible.builtin.systemd:
    name: qemu-ga-virtio
    state: started
  when:
    - qemu_ga_virtio_enabled
    - qemu_ga_virtio_channel.stat.exists

- name: "Starting the ISA serial transport where its serial device exists"
  ansible.builtin.systemd:
    name: qemu-ga-serial
    state: started
  when:
    - qemu_ga_serial_enabled
    - qemu_ga_serial_port.stat.exists
