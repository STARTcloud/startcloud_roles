---
- name: "Setting up Debian Installations"
  when: "ansible_os_family == 'Debian'"
  block:
    - name: "Gathering DEB architecture"
      ansible.builtin.command: dpkg --print-architecture
      register: deb_architecture
      changed_when: false

    - name: "Printing DEB architecture"
      ansible.builtin.debug:
        msg: "deb_architecture.stdout: {{ deb_architecture.stdout }}"

    - name: "Ensuring apt cache is updated"
      ansible.builtin.apt:
        cache_valid_time: 3600
        update_cache: true

    - name: "Upgrading all apt packages"
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

- name: "Setting up the Dante SOCKS server"
  when: ansible_distribution != "Debian" or ansible_distribution_major_version | int < 13
  block:
    - name: "Adding Additional Dependencies {{ dante_packages }}"
      ansible.builtin.apt:
        name: "{{ dante_packages }}"
        state: present

    ## The config is rendered from a template that writes the whole file, so the
    ## delete that used to sit here only guaranteed a changed report on every
    ## run - the write overwrites whatever the package shipped regardless.
    ## `external` is the adapter danted proxies out of; the literal string
    ## "public_adapter" that used to be hardcoded here is not an interface name
    ## and danted refuses to start on it.
    - name: "Creating New Dante Configuration"
      ansible.builtin.template:
        src: danted.conf.j2
        dest: /etc/danted.conf
        mode: "0644"
      notify: "Restart danted"

    ## password_hash('sha512') salts randomly, so the hash differs on every run
    ## and the module reports changed forever. The password only has to be
    ## seeded when the account is created, so leave it alone on later runs.
    - name: "Creating a Dedicated SOCKS User"
      ansible.builtin.user:
        name: "{{ dante_user }}"
        shell: /bin/false
        system: true
        password: "{{ dante_pass | password_hash('sha512') }}"
        update_password: on_create

    ## danted only needs bouncing when its config actually changes - that
    ## restart hangs off the template above. An unconditional `state: restarted`
    ## here reported changed on every run and could never converge.
    - name: "Starting and Enabling Dante Service"
      ansible.builtin.systemd_service:
        name: danted
        state: started
        enabled: true

- name: "Setting up the microsocks SOCKS server (dante-server has no Debian 13+ package)"
  when: ansible_distribution == "Debian" and ansible_distribution_major_version | int >= 13
  block:
    - name: "Installing microsocks"
      ansible.builtin.apt:
        name: microsocks
        state: present

    - name: "Configuring the microsocks Service"
      ansible.builtin.copy:
        dest: /etc/systemd/system/microsocks.service
        mode: "0600"
        content: |
          [Unit]
          Description=microsocks SOCKS5 proxy
          After=network.target

          [Service]
          ExecStart=/usr/bin/microsocks -i 0.0.0.0 -p 1080 -u {{ dante_user }} -P {{ dante_pass }}
          Restart=on-failure
          DynamicUser=yes

          [Install]
          WantedBy=multi-user.target
      notify: "Restart microsocks"

    ## Same reasoning as danted above: the unit only needs bouncing when the
    ## unit file changes, which the copy notifies.
    - name: "Starting and Enabling microsocks Service"
      ansible.builtin.systemd_service:
        name: microsocks
        state: started
        enabled: true
        daemon_reload: true
