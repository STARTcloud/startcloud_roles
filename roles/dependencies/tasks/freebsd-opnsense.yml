---
- name: "Ensuring the OPNsense API credentials are present"
  ansible.builtin.assert:
    that:
      - opnsense_api_key | length > 0
      - opnsense_api_secret | length > 0
    fail_msg: "The OPNsense lane needs opnsense_api_key and opnsense_api_secret"

- name: "Checking the firewall for updates"
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/core/firmware/check"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_api_validate_certs }}"
    body_format: json
    body: {}
    return_content: true
  register: dependencies_opnsense_check
  failed_when: dependencies_opnsense_check.json.status | default('failed') != 'ok'
  changed_when: false
  check_mode: false

- name: "Waiting for the update check to finish"
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/core/firmware/upgradestatus"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_api_validate_certs }}"
    return_content: true
  register: dependencies_opnsense_check_status
  until: dependencies_opnsense_check_status.json.status | default('running') != 'running'
  retries: "{{ dependencies_opnsense_check_retries }}"
  delay: "{{ dependencies_opnsense_poll_delay }}"
  failed_when: dependencies_opnsense_check_status.json.status | default('error') == 'error'
  check_mode: false

- name: "Reading the update state"
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/core/firmware/status"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_api_validate_certs }}"
    return_content: true
  register: dependencies_opnsense_status
  check_mode: false

- name: "Recording the updates that wait"
  ansible.builtin.set_fact:
    dependencies_opnsense_update_pending: "{{ dependencies_opnsense_status.json.status == 'update' }}"
    dependencies_opnsense_version: "{{ dependencies_opnsense_status.json.product.product_version | default('') }}"
  changed_when:
    - dependencies_opnsense_status.json.status == 'update'
    - dependencies_upgrade | bool

- name: "Applying the updates"
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/core/firmware/update"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_api_validate_certs }}"
    body_format: json
    body: {}
    return_content: true
  register: dependencies_opnsense_update
  failed_when: dependencies_opnsense_update.json.status | default('failed') != 'ok'
  changed_when: true
  when:
    - dependencies_upgrade | bool
    - dependencies_opnsense_update_pending | bool
    - not ansible_check_mode

- name: "Waiting for the updates to finish"
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/core/firmware/upgradestatus"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_api_validate_certs }}"
    return_content: true
  register: dependencies_opnsense_update_status
  until: dependencies_opnsense_update_status.json.status | default('running') != 'running'
  retries: "{{ dependencies_opnsense_update_retries }}"
  delay: "{{ dependencies_opnsense_poll_delay }}"
  failed_when: dependencies_opnsense_update_status.json.status | default('error') == 'error'
  when:
    - dependencies_upgrade | bool
    - dependencies_opnsense_update_pending | bool
    - not ansible_check_mode

- name: "Recording the update state"
  ansible.builtin.set_fact:
    dependencies_reboot_required: >-
      {{ dependencies_opnsense_update_status.json.status | default('') == 'reboot'
         or (dependencies_opnsense_update_pending | bool
             and dependencies_opnsense_status.json.status_reboot | default('0') | string == '1'
             and not (dependencies_upgrade | bool)) }}
    dependencies_updates_pending: "{{ (dependencies_opnsense_update_pending | bool) and not (dependencies_upgrade | bool) }}"
