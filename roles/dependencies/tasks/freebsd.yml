---
# pfSense appliances use their own pkg repo and package names — route them to
# a dedicated vars file instead of the OPNsense/FreeBSD baseline (whose os-*
# plugin packages do not exist in the pfSense repo).
- name: "Detecting pfSense Appliance"
  ansible.builtin.stat:
    path: /etc/inc/globals.inc
  register: dependencies_pfsense_check

- name: "Including OS-specific vars"
  ansible.builtin.include_vars: "{{ 'pfsense.yml' if dependencies_pfsense_check.stat.exists else (ansible_os_family | lower ~ '.yml') }}"

- name: "Creating pkg proxy configuration: /usr/local/etc/pkg/repos/proxy.conf"
  ansible.builtin.template:
    src: pkg_proxy.conf.j2
    dest: /usr/local/etc/pkg/repos/proxy.conf
    mode: "0644"
  when: use_proxy | bool

- name: "Creating the package repository key directories"
  ansible.builtin.file:
    path: "{{ item.pubkey_path | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ extra_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: dependencies_repo_key_dirs

- name: "Fetching the package repository public keys"
  ansible.builtin.get_url:
    url: "{{ item.pubkey_url }}"
    dest: "{{ item.pubkey_path }}"
    mode: "0644"
  environment: "{{ dependencies_download_environment }}"
  loop: "{{ extra_repos }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (ansible_check_mode and dependencies_repo_key_dirs is changed)

- name: "Writing the package repository configurations"
  ansible.builtin.template:
    src: pkg_repo.conf.j2
    dest: "/usr/local/etc/pkg/repos/{{ item.name }}.conf"
    mode: "0644"
  loop: "{{ extra_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Refreshing the package catalogues"
  ansible.builtin.command: pkg update
  changed_when: false

- name: "Self-upgrading pkg before installing other packages (pkg mid-install self-upgrades can abort subsequent work)"
  community.general.pkgng:
    name: pkg
    state: latest
  register: pkg_self_upgrade
  until: pkg_self_upgrade is succeeded
  retries: 5
  delay: 10

- name: "Installing baseline packages"
  community.general.pkgng:
    name: "{{ packages }}"
    state: present
  register: pkg_baseline
  until: pkg_baseline is succeeded
  retries: 5
  delay: 10

- name: "Installing extra packages"
  community.general.pkgng:
    name: "{{ extra_packages }}"
    state: present
  register: pkg_extra
  until: pkg_extra is succeeded
  retries: 5
  delay: 10
  when: extra_packages | default([]) | length > 0

- name: "Enabling qemu-guest-agent service (if os-qemu-guest-agent was installed)"
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
  when: "'os-qemu-guest-agent' in packages"

- name: "Starting qemu-guest-agent service (may already be started by plugin post-install hook)"
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
  when: "'os-qemu-guest-agent' in packages"
  failed_when: false
