---
run_tasks: true
extra_packages:
  - htop
  - dos2unix
  - xmlstarlet
packages:
use_proxy: false

manually_intall_updates: false

extra_repos: []

dependencies_install_packages: true
dependencies_windows_update: false
dependencies_windows_categories:
  - SecurityUpdates
  - CriticalUpdates
  - UpdateRollups
  - Updates
  - DefinitionUpdates
dependencies_windows_reboot: false
dependencies_windows_reboot_timeout: 1200
dependencies_mirror: ""
dependencies_mirror_components: main contrib non-free non-free-firmware
dependencies_mirror_keyring: /usr/share/keyrings/debian-archive-keyring.gpg
dependencies_mirror_sources: /etc/apt/sources.list.d/debian.sources
dependencies_pve_repository: ""
dependencies_pve_enterprise_uri: https://enterprise.proxmox.com/debian/pve
dependencies_pve_no_subscription_uri: http://download.proxmox.com/debian/pve
dependencies_pve_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg
dependencies_upgrade: true
dependencies_autoremove: true
dependencies_opnsense_poll_delay: 10
dependencies_opnsense_check_retries: 30
dependencies_opnsense_update_retries: 360
opnsense_api_port: 443
opnsense_api_url: "https://{{ inventory_hostname }}:{{ opnsense_api_port }}/api"
opnsense_api_key: ""
opnsense_api_secret: ""
opnsense_api_validate_certs: true
