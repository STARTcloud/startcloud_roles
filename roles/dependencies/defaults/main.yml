---
run_tasks: true
extra_packages:
  - htop
  - dos2unix
  - xmlstarlet
packages:
use_proxy: false

manually_intall_updates: false

extra_repos: []

dependencies_download_environment: >-
  {{ {'http_proxy': 'http://' ~ proxy_server ~ ':' ~ proxy_port, 'https_proxy': 'http://' ~ proxy_server ~ ':' ~ proxy_port}
     if use_proxy | bool else {} }}
dependencies_mirror: ""
dependencies_mirror_components: main contrib non-free non-free-firmware
dependencies_mirror_keyring: /usr/share/keyrings/debian-archive-keyring.gpg
dependencies_mirror_sources: /etc/apt/sources.list.d/debian.sources
dependencies_pve_repository: ""
dependencies_pve_enterprise_uri: https://enterprise.proxmox.com/debian/pve
dependencies_pve_no_subscription_uri: http://download.proxmox.com/debian/pve
dependencies_pve_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg
dependencies_upgrade: true
dependencies_autoremove: false
dependencies_galera: false
dependencies_galera_sync_retries: 120
reboots_allowed: false
reboot_never: false
dependencies_reboot: "{{ reboots_allowed }}"
dependencies_reboot_timeout: 600
