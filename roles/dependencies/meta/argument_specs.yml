---
argument_specs:
  main:
    short_description: Baseline system dependencies
    description:
      - Installs baseline packages, extra packages, and (on Debian) extra repositories needed by other roles. Dispatches to OS-specific tasks for Debian, RedHat, FreeBSD, OmniOS and Windows.
      - On an OPNsense firewall with an API key it checks for and applies the firewall's own updates through the firmware API and records whether a reboot waits.
      - >-
        On an OpenWrt access point, whose inventory entry sets ansible_os_family to openwrt and whose play gathers no
        facts, it upgrades the firmware and packages with owut when owut reports it safe and waits for the access point
        to come back.
      - >-
        On OmniOS it points the pkg publishers at the mirror for the release the host declares, updates pkg itself,
        upgrades every package into a boot environment and records whether that boot environment waits on a reboot;
        a release change is one word in the inventory, and the upgrade that follows moves the host to it.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      extra_packages:
        type: list
        elements: str
        description: Additional packages installed on top of the OS baseline list.
      packages:
        type: list
        elements: str
        description: OS baseline package list (populated from the OS-specific vars files).
      use_proxy:
        type: bool
        default: false
        description: Render an apt/pkg proxy configuration using proxy_server/proxy_port.
      manually_intall_updates:
        type: bool
        default: false
        description: Reserved toggle for manual update installation (not currently consumed).
      extra_repos:
        type: list
        elements: dict
        description: >-
          Extra APT repositories to add (name, gpg_key_url, gpg_keyring_path, repo, needs_dearmor,
          optional filename defaulting to name, optional stale_source_files listing old duplicate
          source files to remove). On FreeBSD and OPNsense, extra pkg repositories (name, url,
          pubkey_url, pubkey_path, optional priority defaulting to 100). On OmniOS, the pkg publishers
          (name, origin) the host is pointed at when dependencies_omnios_mirror is set; a publisher the
          list does not name is left as it is.
      proxy_server:
        type: str
        description: Hostname or address of the HTTP proxy apt and the key downloads go through when use_proxy is true.
      proxy_port:
        type: int
        description: Port of the HTTP proxy when use_proxy is true.
      dependencies_install_packages:
        type: bool
        default: true
        description: Install the OS baseline packages and extra_packages; off leaves the node's package set as it is and only refreshes and upgrades.
      dependencies_windows_update:
        type: bool
        default: false
        description: >-
          On Windows, run the update path instead of the image-bake path, which searches the update categories,
          installs them where dependencies_upgrade is true, and reports.
      dependencies_windows_categories:
        type: list
        elements: str
        default: [SecurityUpdates, CriticalUpdates, UpdateRollups, Updates, DefinitionUpdates]
        description: Windows Update categories the update path searches and installs.
      dependencies_windows_reboot:
        type: bool
        default: false
        description: Let the Windows update path reboot the node as many times as its updates need; off leaves the reboot to the caller.
      dependencies_windows_reboot_timeout:
        type: int
        default: 1200
        description: Seconds the Windows update path waits for the node to come back from each reboot.
      dependencies_mirror:
        type: str
        default: ""
        description: >-
          Debian mirror root; when set, the node's Debian, updates and security sources are written as
          deb822 stanzas pointing at its debian/ and debian-security/ trees and /etc/apt/sources.list is
          removed. Empty leaves the node's sources untouched.
      dependencies_mirror_components:
        type: str
        default: main contrib non-free non-free-firmware
        description: Components enabled on every mirror suite.
      dependencies_mirror_keyring:
        type: str
        default: /usr/share/keyrings/debian-archive-keyring.gpg
        description: Keyring the mirror's Release files are verified against.
      dependencies_mirror_sources:
        type: str
        default: /etc/apt/sources.list.d/debian.sources
        description: deb822 sources file the mirror stanzas are written to.
      dependencies_pve_repository:
        type: str
        default: ""
        choices: ["", enterprise, no-subscription]
        description: >-
          The Proxmox VE repository a Proxmox host is entitled to; the role checks it against
          pvesubscription get and stops before any change when they disagree, writes pve-enterprise in
          Proxmox's own file form for the release (enabled, or disabled the way Proxmox disables it),
          writes pve-no-subscription only where declared, and removes the installer's
          pve-install-repo.list and any no-subscription file the declaration does not cover. Empty
          leaves Proxmox repositories untouched.
      dependencies_pve_enterprise_uri:
        type: str
        default: https://enterprise.proxmox.com/debian/pve
        description: Repository of pve-enterprise; its credentials are the ones pvesubscription set wrote.
      dependencies_pve_no_subscription_uri:
        type: str
        default: http://download.proxmox.com/debian/pve
        description: Repository of pve-no-subscription.
      dependencies_pve_keyring:
        type: str
        default: /usr/share/keyrings/proxmox-archive-keyring.gpg
        description: Keyring the deb822 stanza is signed by, shipped by the proxmox-archive-keyring package.
      dependencies_omnios_mirror:
        type: str
        default: ""
        description: >-
          Root of the OmniOS package mirror, such as https://omnios.startcloud.com; when set, the host's omnios,
          extra.omnios and STARTcloud publishers are pointed at its <release>/core/, <release>/extra/ and
          <release>/public/ paths. Empty leaves the publishers untouched.
      dependencies_omnios_release:
        type: str
        description: >-
          The OmniOS release the host follows, the path on the mirror: r151054, bloody, r151062; defaults to the
          release the host runs, so a host moves only when the inventory names another.
      dependencies_omnios_startcloud_release:
        type: str
        default: r151054
        description: The release the STARTcloud publisher is served under on the mirror.
      dependencies_upgrade:
        type: bool
        default: true
        description: >-
          Run the dist-upgrade; off keeps the node at its current packages and only reports what is upgradable. The
          role sets the facts dependencies_reboot_required and dependencies_updates_pending for the caller, and
          dependencies_rebooted on Windows.
      dependencies_autoremove:
        type: bool
        default: true
        description: Remove packages no longer needed after the upgrade.
      dependencies_opnsense_poll_delay:
        type: int
        default: 10
        description: Seconds between two reads of the firmware job state while an OPNsense check or update runs.
      dependencies_opnsense_check_retries:
        type: int
        default: 30
        description: Reads of the firmware job state an OPNsense update check may take before the role gives up.
      dependencies_opnsense_update_retries:
        type: int
        default: 360
        description: Reads of the firmware job state an OPNsense update may take before the role gives up.
      dependencies_openwrt_down_timeout:
        type: int
        default: 300
        description: Seconds an OpenWrt access point may take to go down after its upgrade starts.
      dependencies_openwrt_up_delay:
        type: int
        default: 30
        description: Seconds waited before the first check that an upgraded OpenWrt access point is back.
      dependencies_openwrt_up_timeout:
        type: int
        default: 600
        description: Seconds an upgraded OpenWrt access point may take to answer on its SSH port again.
      opnsense_api_port:
        type: int
        default: 443
        description: Port the OPNsense web GUI and API listen on.
      opnsense_api_url:
        type: str
        description: Base address of the OPNsense API; defaults to https://<inventory_hostname>:<opnsense_api_port>/api.
      opnsense_api_key:
        type: str
        default: ""
        description: >-
          OPNsense API key the lane signs in with; empty keeps the plain FreeBSD path (pkg update and the package
          modules), the image-build way.
      opnsense_api_secret:
        type: str
        default: ""
        description: Secret of opnsense_api_key.
      opnsense_api_validate_certs:
        type: bool
        default: true
        description: Whether the firewall's web GUI certificate is checked on API calls.
