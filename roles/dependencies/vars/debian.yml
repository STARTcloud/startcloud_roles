---
extra_packages:
  - htop
packages:
  - htop
  - lynx
  - lshw
  - libxml2-utils
  - tree
  - python3-pexpect
  - python3-pymongo
  - python3-pymysql
  - psutils
  - python3-psutil
  - libxml2-utils

extra_repos:
  - name: "startcloud"
    ## Short-path URL scheme (2026-07) — debian.startcloud.com serves
    ## public/private/mirror by path. The legacy
    ## *.debian.packages.startcloud.com hosts stay online until ~2027-07.
    gpg_key_url: "https://debian.startcloud.com/public/debian/startcloud-archive-keyring.asc"
    gpg_keyring_path: "/etc/apt/keyrings/startcloud-archive-keyring.gpg"
    repo: "deb [arch={{ deb_architecture.stdout }} signed-by=/etc/apt/keyrings/startcloud-archive-keyring.gpg]
      https://debian.startcloud.com/public/debian/ {{ ansible_distribution_release }} main"
    needs_dearmor: true
    filename: "debian-startcloud"
    ## Each URL-scheme migration leaves the previous pinned filename behind;
    ## boxes provisioned under the old schemes still carry these.
    stale_source_files:
      - /etc/apt/sources.list.d/public_debian_packages_startcloud_com_debian.list
      - /etc/apt/sources.list.d/startcloud.list
