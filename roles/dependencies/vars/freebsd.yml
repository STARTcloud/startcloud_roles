---
# Baseline packages installed on every FreeBSD / OPNsense build.
# OPNsense plugins are prefixed with "os-" and pull in their FreeBSD deps
# via the OPNsense repo.
packages:
  - sudo
  - nano
  - lsof
  - nmap
  - os-qemu-guest-agent
  - os-acme-client

extra_repos:
  - name: startcloud-public
    url: "https://opnsense.startcloud.com/public/opnsense/${ABI}"
    pubkey_url: https://opnsense.startcloud.com/pubkey.pem
    pubkey_path: /usr/local/etc/ssl/pkg-repo/opnsense.pub
    priority: 100
