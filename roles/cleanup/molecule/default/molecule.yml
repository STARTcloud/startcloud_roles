---
driver:
  name: docker
platforms:
  - name: startcloud-cleanup-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
scenario:
  # No `idempotence` step: this is an image-finalization role and is
  # non-idempotent by construction. Every run deletes and recreates
  # /etc/machine-id and its dbus link, deletes its own /etc/netplan yaml before
  # re-templating it, wipes apt/var cache directories that apt immediately
  # recreates, and runs purge/rm shell commands hardcoded to changed_when: true.
  # Everything else in the sequence is exercised.
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
