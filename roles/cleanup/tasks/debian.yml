---
- name: "Including OS-specific vars"
  ansible.builtin.include_vars: "{{ ansible_os_family | lower }}.yml"

- name: "Updating apt cache"
  ansible.builtin.apt:
    cache_valid_time: 3600
    update_cache: true

- name: "Upgrading all apt packages"
  ansible.builtin.apt:
    force_apt_get: true
    upgrade: dist

- name: "Removing Unneeded Dev Packages, Docs and Man Pages"
  ansible.builtin.shell: |
    set -o pipefail
    dpkg --list | awk '{ print $2 }' | grep linux-source | xargs apt-get -y purge
    dpkg --list | awk '{ print $2 }' | grep -- '-doc$' | xargs apt-get -y purge
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false

- name: "Removing LXD Snap"
  community.general.snap:
    name:
      - lxd
    state: absent
  failed_when: false

- name: "Removing core18 and core20 Snap"
  community.general.snap:
    name:
      - core18
      - core20
    state: absent
  failed_when: false

- name: "Removing Snapd"
  community.general.snap:
    name:
      - snapd
    state: absent
  failed_when: false

- name: "Removing unwanted packages"
  ansible.builtin.apt:
    name:
      - snapd
      - ppp
      - pppconfig
      - pppoeconf
      - linux-source
      - popularity-contest
      - installation-report
      - landscape-common
      - wireless-tools
      - wpasupplicant
      - ubuntu-serverguide
    state: absent

- name: "Using Deborphan to clean up packages"
  ansible.builtin.shell: |
    set -o pipefail
    deborphan --find-config | xargs apt-get -y purge
    deborphan | xargs apt-get -y purge
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false

- name: "Cleaning up udev rules"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /dev/.udev/
    - /lib/udev/rules.d/75-persistent-net-generator.rules

- name: "Cleaning leftover DHCP Leases"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/dhcp3/*
    - /var/lib/dhcp/*

- name: "Removing Machine ID file"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/machine-id

- name: "Creating empty Machine ID file"
  ansible.builtin.copy:
    content: ""
    dest: "{{ item }}"
    force: false
    mode: "0644"
  loop:
    - /etc/machine-id

- name: "Deregistering the Machine ID"
  ansible.builtin.file:
    path: /var/lib/dbus/machine-id
    state: absent

- name: "Linking Machine ID file"
  ansible.builtin.file:
    src: /etc/machine-id
    dest: /var/lib/dbus/machine-id
    state: link

- name: "Finding Apt cache directories"
  ansible.builtin.find:
    file_type: directory
    paths: /var/lib/apt
  register: apt_cache_files_to_delete

- name: "Removing Apt cache directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ apt_cache_files_to_delete.files }}"

- name: "Finding var cache directories"
  ansible.builtin.find:
    file_type: directory
    paths: /var/cache
  register: var_cache_files_to_delete

- name: "Removing var cache directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ var_cache_files_to_delete.files }}"

- name: "Finding /var/log files.old or .log via regex"
  ansible.builtin.find:
    paths: /var/log
    patterns: "^.*?\\.(?:old|log\\.gz)$"
    use_regex: true
  register: log_files_to_delete

- name: "Removing old log files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ log_files_to_delete.files }}"

- name: "Removing specific log files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/log/lastlog
    - /var/log/wtmp
    - /var/log/btmp

- name: "Truncating Audit Logs"
  ansible.builtin.copy:
    content: ""
    dest: "{{ item }}"
    force: false
    mode: "0644"
  loop:
    - /var/log/lastlog
    - /var/log/wtmp
    - /var/log/btmp

- name: "Clearing the History File"
  ansible.builtin.command: "unset HISTFILE"
  changed_when: false
  failed_when: false

- name: "Finding all log files to truncate"
  ansible.builtin.find:
    paths: /var/log
    file_type: file
    recurse: true
  register: all_log_files

- name: "Truncating all log files"
  ansible.builtin.copy:
    content: ""
    dest: "{{ item.path }}"
    backup: false
    force: true
    mode: preserve
  loop: "{{ all_log_files.files }}"
  failed_when: false

- name: "Removing Caches, Logs, Docs, Man Pages, History, Tmp"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.bash_history
    - "/home/{{ vagrant_user }}/.bash_history"
    - /usr/share/doc/*
    - /usr/share/man/*
    - /tmp/*

- name: "Recreating Doc and Man directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /usr/share/doc/
    - /usr/share/man/

- name: "Recreating TMP"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - /tmp/

- name: "Removing useless packages from the cache"
  ansible.builtin.apt:
    autoclean: true

- name: "Registering Stale Netplan Configs"
  ansible.builtin.find:
    paths: /etc/netplan
    patterns: "*.yaml"
  register: netplan_files_to_delete

- name: "Removing old YAML configs"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ netplan_files_to_delete.files }}"

- name: "Adding enp0s6 for DHCP for BHYVE Zones"
  ansible.builtin.template:
    dest: /etc/netplan/50-cloud-init.yaml
    mode: "0755"
    src: dhcp-all.debian.yaml.j2

- name: "Purging and Autoremoving packages"
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: "Running Final Cleanup Commands"
  ansible.builtin.command: "{{ item }}"
  loop:
    - "sudo apt-get --purge autoremove"
    - "rm /var/lib/dbus/machine-id"
    - "sudo rm -rf /snap"
    - "sudo rm -rf /root/snap"
    - "sudo rm -rf /var/snap"
    - "sudo rm -rf /etc/cloud"
    - "sudo rm -rf /var/lib/cloud"
  changed_when: true
  failed_when: false

- name: "Removing old directories and files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/snap"
    - "/root/snap"
    - "/var/snap"
    - "/etc/cloud"
    - "/var/lib/cloud"

- name: "Recreating cloud-init configuration directory"
  ansible.builtin.file:
    path: /etc/cloud
    state: directory
    mode: "0755"

- name: "Writing cloud-gated cloud-init configuration"
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg
    mode: "0644"
    content: |
      # One dormant config shipped in every image: ds-identify only finds the
      # DigitalOcean datasource on DigitalOcean hardware (DMI sys-vendor) and the
      # Ec2 datasource on EC2 hardware (DMI uuid), where cloud-init then injects
      # the per-launch keypair via the ssh module. On VirtualBox, bhyve and UTM
      # nothing is found and cloud-init disables itself at boot, matching the
      # prior behavior of deleting /etc/cloud.
      datasource_list: [ DigitalOcean, Ec2 ]

      users:
        - default
      disable_root: true
      preserve_hostname: false
      manage_etc_hosts: false

      cloud_init_modules:
        - migrator
        - seed_random
        - bootcmd
        - write-files
        - growpart
        - resizefs
        - set_hostname
        - update_hostname
        - users-groups
        - ssh

      cloud_config_modules:
        - timezone
        - runcmd

      cloud_final_modules:
        - scripts-per-once
        - scripts-per-boot
        - scripts-per-instance
        - scripts-user
        - final-message

      system_info:
        distro: debian
        default_user:
          name: "{{ vagrant_user | default('startcloud') }}"
          lock_passwd: false
          gecos: STARTcloud
          groups: [adm, cdrom, dip, plugdev, sudo]
          sudo: ["ALL=(ALL) NOPASSWD:ALL"]
          shell: /bin/bash
        network:
          renderers: ['netplan', 'eni', 'networkd']
        ssh_svcname: ssh
