---
- name: "RedHat | Using RHEL 7 packages for Fedora"
  ansible.builtin.set_fact:
    telegraf_redhat_releasever: 7
  when:
    - ansible_distribution == "Fedora"

- name: "RedHat | Adding yum repository"
  ansible.builtin.yum_repository:
    name: influxdb
    description: InfluxDB Repository - RHEL $releasever
    baseurl: "{{ telegraf_yum_baseurl[ansible_distribution | lower] | default(telegraf_yum_baseurl['default']) }}"
    gpgcheck: "{{ telegraf_yum_gpgcheck }}"
    gpgkey: "{{ telegraf_yum_gpgkey }}"
  become: true
  when:
    - telegraf_agent_package_method == "repo"

- name: "RedHat | Downloading Telegraf package (online)"
  ansible.builtin.get_url:
    url: "https://dl.influxdata.com/telegraf/releases/{{ telegraf_agent_package_file_rpm }}"
    dest: "{{ telegraf_agent_package_path }}/{{ telegraf_agent_package_file_rpm }}"
    mode: "0644"
    use_proxy: "{{ true if http_proxy is defined and http_proxy else false }}"
  environment:
    http_proxy: "{{ http_proxy | default(None) | default(omit) }}"
    https_proxy: "{{ https_proxy | default(None) | default(omit) }}"
  become: true
  when:
    - telegraf_agent_package_method == "online"

- name: "RedHat | Installing Telegraf package from the repository"
  ansible.builtin.package:
    name: "{{ telegraf_agent_package }}"
    state: "{{ telegraf_agent_package_state }}"
  register: is_telegraf_package_installed
  until: is_telegraf_package_installed is succeeded
  become: true
  notify: "Restarting Telegraf"
  when:
    - telegraf_agent_package_method == "repo"

- name: "RedHat | Installing the downloaded Telegraf package"
  ansible.builtin.package:
    name: "{{ telegraf_agent_package_path }}/{{ telegraf_agent_package_file_rpm }}"
    state: "present"
  register: is_telegraf_package_installed
  until: is_telegraf_package_installed is succeeded
  become: true
  notify: "Restarting Telegraf"
  when:
    - telegraf_agent_package_method == "online" or telegraf_agent_package_method == "offline"
