---
argument_specs:
  main:
    short_description: Google Chrome and Chromedriver installation
    description:
      - Adds the Google Chrome apt repository, installs google-chrome-stable, and downloads/extracts a matching Chromedriver for web development.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      installer_dir:
        type: str
        default: /vagrant/installers
        description: Directory where installer artifacts are staged; the Chromedriver archive is downloaded beneath it.
      chrome_signing_key_url:
        type: str
        default: https://dl-ssl.google.com/linux/linux_signing_key.pub
        description: URL of the Google apt signing key.
      chrome_apt_repository:
        type: str
        default: deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main
        description: Sole deb line written to /etc/apt/sources.list.d/google-chrome.list, which the role owns outright.
      chrome_driver_version:
        type: str
        default: "2.41"
        description: Chromedriver version to download.
      chrome_driver_server_installer_tar:
        type: str
        default: chromedriver_linux64.zip
        description: Chromedriver archive filename.
      chrome_driver_url:
        type: str
        default: https://chromedriver.storage.googleapis.com/
        description: Base URL Chromedriver is downloaded from.
      chrome_driver_install_dir:
        type: str
        default: /usr/local/bin
        description: PATH directory the chromedriver binary is extracted into.
