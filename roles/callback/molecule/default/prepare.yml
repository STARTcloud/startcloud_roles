---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Create the callback stub directory
      ansible.builtin.file:
        path: /opt/callback-stub
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the callback stub HTTP listener
      ansible.builtin.copy:
        dest: /opt/callback-stub/server.py
        owner: root
        group: root
        mode: "0755"
        content: |
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          LOG_PATH = "/var/log/callback-stub.log"


          class CallbackHandler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  raw = self.rfile.read(length).decode("utf-8")
                  record = {
                      "method": "POST",
                      "path": self.path,
                      "content_type": self.headers.get("Content-Type", ""),
                      "body": raw,
                  }
                  with open(LOG_PATH, "a", encoding="utf-8") as handle:
                      handle.write(json.dumps(record) + "\n")
                  payload = b"OK"
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, fmt, *args):
                  return


          HTTPServer(("127.0.0.1", 8099), CallbackHandler).serve_forever()

    - name: Install the callback stub systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/callback-stub.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Molecule callback stub listener
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 /opt/callback-stub/server.py
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable the callback stub listener
      ansible.builtin.systemd_service:
        name: callback-stub.service
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for the callback stub listener to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8099
        state: started
        timeout: 30
