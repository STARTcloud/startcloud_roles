---
# make(1) itself decides whether sendmail.cf is stale: the module runs
# `make --question` first and only rebuilds — and only reports changed —
# when the compiled configuration is actually out of date.
- name: "Rebuilding Sendmail Configuration"
  community.general.make:
    chdir: "{{ sendmail_config_dir }}"
- name: "Restarting Sendmail Service"
  ansible.builtin.systemd_service:
    name: "{{ sendmail_service_name }}"
    state: restarted
