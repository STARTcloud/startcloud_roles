---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: "Populating the apt cache the role assumes already exists"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      register: zrepl_prepare_cache
      until: zrepl_prepare_cache is succeeded
      retries: 3
      delay: 5

    - name: "Installing ca-certificates so the upstream zrepl repo is reachable over https"
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present
