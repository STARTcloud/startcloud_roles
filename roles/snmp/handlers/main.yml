---
- name: Stop snmp before writing config
  become: true
  listen: Reconfigure snmp
  ansible.builtin.service:
    name: "{{ snmp_service_name }}"
    state: stopped
  when: not (ansible_check_mode and snmp_install | default({}) is changed)

- name: Write snmp config
  become: true
  listen: Reconfigure snmp
  ansible.builtin.template:
    src: "snmp/snmpd.conf.j2"
    dest: "{{ snmp_config }}"
    owner: root
    group: root
    mode: "0600"
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  notify:
    - Restart snmp
    - Enabled snmp

- name: Start snmp after writing config
  become: true
  listen: Reconfigure snmp
  ansible.builtin.service:
    name: "{{ snmp_service_name }}"
    state: started
  when: not (ansible_check_mode and snmp_install | default({}) is changed)

- name: Restart snmp
  become: true
  ansible.builtin.service:
    name: "{{ snmp_service_name }}"
    state: restarted
  when: not (ansible_check_mode and snmp_install | default({}) is changed)

- name: Enabled snmp
  become: true
  ansible.builtin.service:
    name: "{{ snmp_service_name }}"
    enabled: true
  when: not (ansible_check_mode and snmp_install | default({}) is changed)

- name: Start snmp
  become: true
  ansible.builtin.service:
    name: "{{ snmp_service_name }}"
    state: started
  when: not (ansible_check_mode and snmp_install | default({}) is changed)

- name: "Reconfiguring the OPNsense SNMP agent"
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/netsnmp/service/reconfigure"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_api_validate_certs }}"
    body_format: json
    body: {}
    return_content: true
  register: snmp_opnsense_reconfigure
  failed_when: snmp_opnsense_reconfigure.json.status | default('failed') != 'ok'
  changed_when: true
  when: not ansible_check_mode
