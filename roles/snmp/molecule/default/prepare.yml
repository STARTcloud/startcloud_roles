---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: "Refreshing the apt package cache"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      register: snmp_apt_cache
      until: snmp_apt_cache is succeeded
      retries: 3
      delay: 5
      when: ansible_pkg_mgr == 'apt'
