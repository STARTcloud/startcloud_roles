---
- name: Converge
  hosts: all
  become: true
  vars:
    run_tasks: true
    email: admin@example.com
    snmp_location: "STARTcloud Molecule Lab"
    snmp_user: snmpmonitor
    snmp_password: CHANGEME
    snmp_encryption: CHANGEME
    snmp_additional_packages: []
    snmp_extension_scripts: /usr/local/lib/snmpd
    snmp_extension_list:
      - extend: ".1.3.6.1.4.1.2021.7890.1 distro {{ snmp_extension_scripts }}/distro"
        url: "https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/distro"
      - extend: "osupdate {{ snmp_extension_scripts }}/osupdate"
        url: "https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/osupdate"
    snmp_agentaddress_address:
      ipv4: "127.0.0.1"
      ipv6: "::1"
    snmp_agentaddress_port:
      ipv4: 161
      ipv6: 161
    snmp_agentaddress_protocol:
      ipv4: udp
      ipv6: udp6
    settings:
      hostname: startcloud-snmp-debian12
      domain: molecule.local
  roles:
    - role: snmp
