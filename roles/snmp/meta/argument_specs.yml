---
argument_specs:
  main:
    short_description: Install and configure the SNMP daemon
    description:
      - Installs the net-snmp packages and starts the snmpd service on Linux and OmniOS, or enables the SNMP-Service feature on Windows.
      - Deploys the LibreNMS extension scripts and renders the snmpd daemon and configuration files from templates.
      - On OPNsense it writes the community, location and contact of the os-net-snmp plugin through the firewall's API with an API key.
      - On a Cisco IOS switch (inventory ansible_os_family ios, connection network_cli, no facts gathered) it writes the snmp-server community, location and contact lines with cisco.ios.ios_config.
      - >-
        On an OpenWrt access point (inventory ansible_os_family openwrt, no facts gathered) it installs the snmpd package
        with apk when it is missing, writes the community, sysLocation and sysContact with uci and restarts snmpd.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      use_proxy:
        type: bool
        default: false
        description: Download the extension scripts through proxy_server and proxy_port.
      snmp_additional_packages:
        type: list
        elements: str
        default: []
        description: Extra packages to install alongside the base SNMP packages.
      snmp_agentaddress:
        type: list
        elements: str
        default: []
        description: agentAddress lines written as given (for example udp:161); empty renders one per default IPv4 and IPv6 address.
      snmp_agentaddress_address:
        type: dict
        description: IPv4 and IPv6 addresses the SNMP agent listens on when snmp_agentaddress is empty.
      snmp_agentaddress_port:
        type: dict
        description: IPv4 and IPv6 ports the SNMP agent listens on when snmp_agentaddress is empty.
      snmp_agentaddress_protocol:
        type: dict
        description: IPv4 and IPv6 transport protocols the SNMP agent uses when snmp_agentaddress is empty.
      snmp_community:
        type: str
        default: ""
        description: Read-only SNMPv2c community; empty writes no rocommunity line.
      snmp_community_view:
        type: str
        default: all
        description: View the community reads (all, or systemonly).
      snmp_contact:
        type: str
        description: sysContact; defaults to the email variable.
      snmp_location:
        type: str
        default: ""
        description: sysLocation.
      snmp_v3:
        type: bool
        default: true
        description: Create the SNMPv3 user from snmp_user, snmp_password and snmp_encryption.
      snmp_encryption:
        type: str
        default: snmp_encryption
        description: SNMPv3 privacy passphrase for the user.
      snmp_extension_list:
        type: list
        elements: dict
        description: LibreNMS extension scripts to download, each with an extend directive and a source url.
      snmp_extension_scripts:
        type: str
        default: /usr/local/lib/snmpd
        description: Directory where the SNMP extension scripts are installed.
      snmp_logging_options:
        type: str
        default: ""
        description: Command-line logging options passed to the snmpd daemon.
      snmp_password:
        type: str
        default: snmp_password
        description: SNMPv3 authentication passphrase for the user.
      snmp_user:
        type: str
        default: snmp
        description: SNMPv3 username created on the agent.
      opnsense_api_port:
        type: int
        default: 443
        description: Port the OPNsense web GUI and API listen on.
      opnsense_api_url:
        type: str
        description: Base address of the OPNsense API; defaults to https://<inventory_hostname>:<opnsense_api_port>/api.
      opnsense_api_key:
        type: str
        default: ""
        description: OPNsense API key the lane signs in with.
      opnsense_api_secret:
        type: str
        default: ""
        description: Secret of opnsense_api_key.
      opnsense_api_validate_certs:
        type: bool
        default: true
        description: Whether the firewall's web GUI certificate is checked on API calls.
