---
run_tasks: true

# Install mode: false = STARTcloud apt package (production default),
# true = git clone + npm build (dev environments).
boxvault_build_from_source: false

# STARTcloud APT repository BoxVault is installed from. Short-path URL scheme
# (2026-07) — debian.startcloud.com serves public/private/mirror by path and
# matches roles/dependencies/vars/debian.yml. The legacy
# *.debian.packages.startcloud.com hosts stay online until ~2027-07 only.
boxvault_apt_key_url: "https://debian.startcloud.com/public/debian/startcloud-archive-keyring.asc"
boxvault_apt_repo_url: "https://debian.startcloud.com/public/debian/"
boxvault_apt_keyring_path: "/etc/apt/keyrings/startcloud-archive-keyring.gpg"
boxvault_package: boxvault

# The boxvault package declares "Depends: nodejs (>= 22)", which the stock
# Debian 12 nodejs (18.x) cannot satisfy, so the role lays down NodeSource
# itself instead of assuming roles/nodejs ran first. Paths and pin priority
# match roles/nodejs/tasks/setup-Debian.yml so the two roles are a no-op for
# each other when both run.
boxvault_nodejs_version: "22.x"
boxvault_nodejs_key_url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
boxvault_nodejs_keyring_path: "/etc/apt/keyrings/nodesource.gpg"

# Source build settings.
boxvault_path: "/opt/boxvault"
boxvault_git_repo: "https://github.com/Makr91/BoxVault.git"
boxvault_git_version: main
