---
argument_specs:
  main:
    short_description: BoxVault installation
    description:
      - Installs BoxVault from the STARTcloud APT repository (default) or builds it from the GitHub source via git clone and npm (backend + frontend).
      - The APT path also configures the NodeSource repository because the boxvault package depends on nodejs (>= 22).
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      boxvault_build_from_source:
        type: bool
        default: false
        description: Build from source (git clone + npm) instead of installing the STARTcloud apt package.
      boxvault_apt_key_url:
        type: str
        default: "https://debian.startcloud.com/public/debian/startcloud-archive-keyring.asc"
        description: URL of the armored STARTcloud APT signing key.
      boxvault_apt_repo_url:
        type: str
        default: "https://debian.startcloud.com/public/debian/"
        description: Base URL of the STARTcloud APT repository.
      boxvault_apt_keyring_path:
        type: str
        default: /etc/apt/keyrings/startcloud-archive-keyring.gpg
        description: Path of the dearmored STARTcloud keyring the APT source is signed by.
      boxvault_package:
        type: str
        default: boxvault
        description: Package name of the BoxVault frontend.
      boxvault_nodejs_version:
        type: str
        default: "22.x"
        description: NodeSource distribution branch installed to satisfy the boxvault package's nodejs (>= 22) dependency.
      boxvault_nodejs_key_url:
        type: str
        default: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
        description: URL of the armored NodeSource APT signing key.
      boxvault_nodejs_keyring_path:
        type: str
        default: /etc/apt/keyrings/nodesource.gpg
        description: Path of the dearmored NodeSource keyring the NodeSource source is signed by.
      boxvault_path:
        type: str
        default: /opt/boxvault
        description: Installation directory used when building from source.
      boxvault_git_repo:
        type: str
        default: "https://github.com/Makr91/BoxVault.git"
        description: Git repository cloned when building from source.
      boxvault_git_version:
        type: str
        default: main
        description: Git branch, tag, or commit checked out when building from source.
