---
run_tasks: true
quick_start: false
# Overridden by the community.docker.current_container_facts fact the role
# gathers in tasks/main.yml (host facts outrank role defaults), so this is only
# the value consumers see when that gather never ran. Container builds get the
# supervisord program file instead of the systemd unit and the cockpit restart.
ansible_module_running_in_container: false
python_simple_web_server_path: "{{ service_home_dir }}"
index: index.html.j2
index_name: welcome.html
provisioner_name: Ad-Hoc Playbook
provisioner_version: v0.0.0
core_provisioner_version: v0.0.0
domino_server_name: "{{ settings.hostname }}"
domino_server_domain: "{{ settings.domain }}"
startcloud_quick_start_port_forwards:
  - guest: 8000
    url: "demo"
startcloud_quick_start_proxy_url: "{{ startcloud_quick_start_port_forwards[0].url }}.{{ settings.hostname }}.{{ settings.domain }}"
