---
- name: Converge
  hosts: all
  become: true
  vars:
    run_tasks: true
    redis_package: redis-server
    redis_service: redis-server
    redis_config_file: /etc/redis/redis.conf
    redis_bind: 127.0.0.1
    redis_port: 6379
    redis_databases: 24
    redis_maxmemory: 512mb
    redis_maxmemory_policy: allkeys-lru
    redis_requirepass: CHANGEME
    # Minimal provisioner-context stand-ins so the role runs standalone
    settings:
      hostname: startcloud-redis
      domain: startcloud.test
  tasks:
    - name: "Include the redis role"
      ansible.builtin.include_role:
        name: redis
