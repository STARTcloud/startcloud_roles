---
argument_specs:
  main:
    short_description: Guest security lockdown
    description:
      - Disables unneeded/risky services, rotates the default user password, generates and installs an SSH key, and optionally scrubs sensitive files. Dispatches to Debian and Windows tasks.
      - On OPNsense it writes the os-oidc-login plugin's settings and user map through the firewall's API, so the web GUI signs in through the OpenID Provider.
      - >-
        On OmniOS it gates SSH logins on pam-ciba push approval, with the service module pam_ciba.so.1 as a binding
        entry of the sshd service in /etc/pam.conf and the sshd settings written into /etc/ssh/sshd_config.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      show_help:
        type: bool
        default: true
        description: Whether to display help/informational output.
      lockdown_user_private_key_path:
        type: str
        default: /home/startcloud/.ssh/id_ssh_rsa
        description: Path of the generated SSH private key.
      lockdown_use_settings_password:
        type: bool
        default: false
        description: Use the Vagrant/settings password instead of lockdown_new_password.
      lockdown_new_password:
        type: str
        default: "STARTcloud24@!"
        description: New password for the default user (override in production).
      lockdown:
        type: list
        elements: str
        description: Services to stop and disable.
      lockdown_file_cleanups_list:
        type: list
        elements: str
        description: Files/paths to remove during cleanup (other roles may append).
      lockdown_cleanup_debug_files:
        type: bool
        default: false
        description: Gate for the sensitive-file cleanup step.
      lockdown_disable_ssh_password_auth:
        type: bool
        default: false
        description: >-
          Write PasswordAuthentication no as /etc/ssh/sshd_config.d/00-lockdown.conf and restart sshd, leaving the
          rotated key as the only login path. The 00- prefix sorts first so it wins over later drop-ins such as
          cloud-init's; off by default for locally built machines that log in by password.
      lockdown_rotate_user:
        type: bool
        default: true
        description: Rotate the startcloud password and generate and authorize its SSH keypair; off leaves the account untouched, for a machine whose accounts are already settled.
      lockdown_pam_ciba:
        type: bool
        default: false
        description: >-
          Sign SSH logins in through the OpenID Provider's push approval: installs pam-ciba from the STARTcloud
          repository, writes its configuration, places it in the sshd PAM stack above common-auth and writes
          /etc/ssh/sshd_config.d/10-pam-ciba.conf (key plus keyboard-interactive for every login, password only
          for the health user, key alone from the key addresses). On OmniOS the stack is a binding entry for
          the sshd service in /etc/pam.conf above the stock password lines, so an account with no entry in
          lockdown_pam_ciba_users signs in by its password, and the sshd settings go into /etc/ssh/sshd_config.
      lockdown_pam_ciba_issuer:
        type: str
        default: ""
        description: The OpenID Provider's issuer identifier, an https URL.
      lockdown_pam_ciba_client_id:
        type: str
        default: ""
        description: The public client registered at the provider for this host with the CIBA grant and poll delivery.
      lockdown_pam_ciba_scope:
        type: str
        default: openid profile
        description: Scope of the authentication request; contains openid.
      lockdown_pam_ciba_details_type:
        type: str
        default: pam_sign_in
        description: The RFC 9396 authorization details type the provider has registered for the client; empty sends none.
      lockdown_pam_ciba_users:
        type: dict
        default: {}
        description: Local account name to the provider account it signs in as; an account without an entry is refused.
      lockdown_pam_ciba_health_user:
        type: str
        default: ""
        description: Local account that keeps password login and skips the push approval, for a monitoring tool that cannot use keys; empty keeps none.
      lockdown_pam_ciba_key_addresses:
        type: list
        elements: str
        default: []
        description: Addresses or networks from which the mapped accounts sign in by key alone, with no push approval.
      lockdown_pam_ciba_key_users:
        type: list
        elements: str
        default: []
        description: >-
          Local accounts that sign in by key alone from anywhere, with no push approval, for a service
          account such as the configuration controller's; the health user listed here keeps its password
          login beside the key.
      lockdown_pam_ciba_login_grace_time:
        type: str
        default: 6m
        description: sshd LoginGraceTime, longer than the provider's request lifetime so the end-user has the whole lifetime to approve.
      lockdown_opnsense_oidc:
        type: bool
        default: false
        description: On an OPNsense firewall, write the os-oidc-login plugin's settings and user map through the API.
      lockdown_opnsense_oidc_issuer:
        type: str
        default: ""
        description: The OpenID Provider's issuer identifier the web GUI signs in through.
      lockdown_opnsense_oidc_client_id:
        type: str
        default: ""
        description: The client registered at the provider for this firewall's web GUI.
      lockdown_opnsense_oidc_client_secret:
        type: str
        default: ""
        description: Secret of that client; the plugin never reads it back, so it is sent on every write of the settings.
      lockdown_opnsense_oidc_set_secret:
        type: bool
        default: false
        description: Force one write of the settings so a changed secret reaches the firewall; the plugin cannot show whether the stored one differs.
      lockdown_opnsense_oidc_scopes:
        type: str
        default: openid profile email
        description: Scopes the web GUI asks the provider for.
      lockdown_opnsense_oidc_username_claim:
        type: str
        default: email
        description: Claim of the ID token that names the provider account.
      lockdown_opnsense_oidc_button:
        type: str
        default: Single Sign-On
        description: Text of the sign-in button on the login page.
      lockdown_opnsense_oidc_primary_button:
        type: bool
        default: true
        description: Draw the sign-in button as the primary one.
      lockdown_opnsense_oidc_hide_local:
        type: bool
        default: true
        description: Hide the password form on the login page.
      lockdown_opnsense_oidc_auto_sign_in:
        type: bool
        default: true
        description: Send the browser to the provider as soon as the login page opens.
      lockdown_opnsense_oidc_provider_logout:
        type: bool
        default: true
        description: Sign out at the provider as well when the web GUI signs out.
      lockdown_opnsense_oidc_prompt:
        type: str
        default: ""
        choices: ["", login, select_account]
        description: The prompt the provider is asked for; empty lets the provider decide.
      lockdown_opnsense_oidc_users:
        type: dict
        default: {}
        description: Local web GUI account name to the provider account it signs in as.
      opnsense_api_port:
        type: int
        default: 443
        description: Port the OPNsense web GUI and API listen on.
      opnsense_api_url:
        type: str
        description: Base address of the OPNsense API; defaults to https://<inventory_hostname>:<opnsense_api_port>/api.
      opnsense_api_key:
        type: str
        default: ""
        description: OPNsense API key the lane signs in with.
      opnsense_api_secret:
        type: str
        default: ""
        description: Secret of opnsense_api_key.
      opnsense_api_validate_certs:
        type: bool
        default: true
        description: Whether the firewall's web GUI certificate is checked on API calls.
      vagrant_user:
        type: str
        description: >-
          Provisioner context. Windows account whose password is rotated; supplied by the provisioner's
          settings block, falling back to Administrator when absent.
      vagrant_user_pass:
        type: str
        description: >-
          Provisioner context. Password taken from the provisioner's settings block and used instead of
          lockdown_new_password when lockdown_use_settings_password is true. No role default by design.
      ansible_module_running_in_container:
        type: bool
        description: >-
          Provisioner context. Runtime fact set by community.docker.current_container_facts at the top of
          the Debian tasks; true inside a container, where the host owns the init units and the service
          lockdown stage is skipped. Gathered by the role, never passed in.
