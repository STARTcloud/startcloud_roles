---
run_tasks: true

show_help: true
lockdown_user_private_key_path: /home/startcloud/.ssh/id_ssh_rsa
lockdown_use_settings_password: false
lockdown_new_password: "STARTcloud24@!"
lockdown:
  - exim4
  - portmap
  - rpcbind.target
  - rpcbind.service
  - rpcbind.socket
  - nfs-kernel-server

enabled_roles: >-
  {{ ((provision_roles | default([]) | selectattr('vars.run_tasks', 'undefined') | list)
      + (provision_roles | default([]) | selectattr('vars.run_tasks', 'defined')
         | selectattr('vars.run_tasks') | list))
     | map(attribute='name') | list }}

lockdown_nfs_enabled: "{{ 'startcloud.startcloud_roles.nfs' in enabled_roles }}"

lockdown_effective_services: >-
  {{ lockdown | difference(['portmap', 'rpcbind.target', 'rpcbind.service', 'rpcbind.socket', 'nfs-kernel-server'])
     if lockdown_nfs_enabled | bool else lockdown }}

lockdown_disable_ssh_password_auth: false

# List of files/paths to be cleaned up by the lockdown role.
# Other roles can append to this list.
lockdown_file_cleanups_list: []
# Gate the sensitive-file cleanup step. Off by default; opt in via Hosts.yml when ready to scrub.
lockdown_cleanup_debug_files: false

lockdown_rotate_user: true
lockdown_pam_ciba: false
lockdown_pam_ciba_issuer: ""
lockdown_pam_ciba_client_id: ""
lockdown_pam_ciba_scope: openid profile
lockdown_pam_ciba_details_type: pam_sign_in
lockdown_pam_ciba_users: {}
lockdown_pam_ciba_health_user: ""
lockdown_pam_ciba_key_addresses: []
lockdown_pam_ciba_key_users: []
lockdown_pam_ciba_login_grace_time: 6m

lockdown_opnsense_oidc: false
lockdown_opnsense_oidc_issuer: ""
lockdown_opnsense_oidc_client_id: ""
lockdown_opnsense_oidc_client_secret: ""
lockdown_opnsense_oidc_set_secret: false
lockdown_opnsense_oidc_scopes: openid profile email
lockdown_opnsense_oidc_username_claim: email
lockdown_opnsense_oidc_button: Single Sign-On
lockdown_opnsense_oidc_primary_button: true
lockdown_opnsense_oidc_hide_local: true
lockdown_opnsense_oidc_auto_sign_in: true
lockdown_opnsense_oidc_provider_logout: true
lockdown_opnsense_oidc_prompt: ""
lockdown_opnsense_oidc_users: {}
opnsense_api_port: 443
opnsense_api_url: "https://{{ inventory_hostname }}:{{ opnsense_api_port }}/api"
opnsense_api_key: ""
opnsense_api_secret: ""
opnsense_api_validate_certs: true
