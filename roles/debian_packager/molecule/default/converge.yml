---
- name: "Converge"
  hosts: all
  become: true
  vars:
    # Provisioner-context variables the role assumes but does not define itself.
    settings:
      hostname: "packager"
      domain: "startcloud.test"
    service_user: "startcloud"
    service_home_dir: "/home/startcloud"
    email: "support@startcloud.com"
    # Role variables (mirroring defaults/main.yml with realistic values).
    run_tasks: true
    package_org: "startcloud"
    package_arch:
      - arm64
      - amd64
    package_name: "startcloud"
    package_version: "0.0.1"
    package_maintainer_email: "support@startcloud.com"
    package_dependencies:
      - libc6
    package_maintainer_address: "https://www.startcloud.com"
    package_description: "Package to Manage and Monitor STARTcloud instances"
  tasks:
    - name: "Including the debian_packager role"
      ansible.builtin.include_role:
        name: debian_packager
