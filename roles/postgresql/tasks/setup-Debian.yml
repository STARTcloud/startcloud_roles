---
- name: "Ensuring PostgreSQL Python libraries are installed"
  ansible.builtin.apt:
    name: "{{ postgresql_python_library }}"
    state: present
    update_cache: true

- name: "Ensuring PostgreSQL packages are installed"
  ansible.builtin.apt:
    name: "{{ postgresql_packages }}"
    state: present
    update_cache: true

- name: "Ensuring all configured locales are present"
  community.general.locale_gen:
    name: "{{ item }}"
    state: "present"
  with_items: "{{ postgresql_locales }}"
  register: locale_gen_result

# The packages above start the server, and it only sees locales generated
# after that once it restarts. A handler would wait for the end of the play,
# after other roles have already created databases in the new locale.
- name: "Restarting PostgreSQL so it can use the new locales"
  ansible.builtin.service:
    name: "{{ postgresql_daemon }}"
    state: restarted
  when: locale_gen_result.changed
