---
- name: Gate SSH logins on pam-ciba push approval
  hosts: pam_ciba
  serial: 1
  any_errors_fatal: true
  become: true
  gather_facts: true
  roles:
    - role: startcloud.startcloud_roles.lockdown
      lockdown_pam_ciba: true
      lockdown_disable_ssh_password_auth: true
      lockdown_use_settings_password: false
      lockdown_new_password: "{{ lockdown_rotated_password }}"
