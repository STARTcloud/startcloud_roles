---
- name: Update every virtual machine and Raspberry Pi
  hosts: vms:pis
  serial: 1
  any_errors_fatal: true
  become: true
  gather_facts: true
  roles:
    - role: startcloud.startcloud_roles.dependencies
  tasks:
    - name: "Pulling the compose images and recreating the changed containers"
      ansible.builtin.include_role:
        name: startcloud.startcloud_roles.container
        tasks_from: compose-update.yml
      when: container_compose_update | default(false) | bool

- name: Summarising the run
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Collecting the reboot state of every node"
      ansible.builtin.set_fact:
        update_summary_needing: >-
          {{ hostvars | dict2items | selectattr('value.dependencies_summary_reboot_required', 'defined')
             | selectattr('value.dependencies_summary_reboot_required') | map(attribute='key') | list }}
        update_summary_rebooted: >-
          {{ hostvars | dict2items | selectattr('value.dependencies_summary_rebooted', 'defined')
             | selectattr('value.dependencies_summary_rebooted') | map(attribute='key') | list }}
        update_summary_pending: >-
          {{ hostvars | dict2items | selectattr('value.dependencies_summary_pending', 'defined')
             | selectattr('value.dependencies_summary_pending') | map(attribute='key') | list }}

    - name: "Reporting the run"
      ansible.builtin.debug:
        msg:
          reboots_pending_on: "{{ update_summary_needing }}"
          rebooted: "{{ update_summary_rebooted }}"
          updates_pending_on: "{{ update_summary_pending }}"
